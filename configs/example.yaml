# ObjectFS configuration — minimal, and every key below is read on the mount path.
#
# That is a deliberate property of this file, not a description of the schema: several keys in the
# full schema parse and validate while being read by nothing, and they are excluded here rather
# than listed with a caveat. examples/config.yaml has the complete set and marks those.
#
# Copy to /etc/objectfs/config.yaml (or pass --config), then mount:
#
#     objectfs --config /etc/objectfs/config.yaml s3://my-research-data /mnt/objectfs
#
# ObjectFS starts from built-in defaults and this file overrides them, so anything you are happy
# with can simply be left out. For the complete schema with every available setting and its
# default, see examples/config.yaml.
#
# Unknown keys are rejected at startup, naming the key and the line. Before v0.10.1 they were
# discarded in silence, which is how the previous version of this file came to be 162 lines of
# settings that did nothing at all — it opened with a top-level `s3:` block where the schema has
# `storage.s3`, so the region it set never applied and the mount ran in us-east-1. If a key here
# is misspelled you will now be told, rather than getting defaults while believing otherwise.
#
# Credentials are deliberately absent. ObjectFS uses the standard AWS credential chain
# (AWS_PROFILE, environment variables, the shared credentials file, EC2/ECS instance roles), so
# it picks up whatever `aws s3 ls` already works with. Do not put secrets in this file.

global:
  log_level: INFO                     # DEBUG, INFO, WARN, ERROR
  log_file: ""                        # empty = stderr

storage:
  s3:
    # The bucket comes from the s3:// argument on the command line, not from here.
    region: us-west-2
    # endpoint: https://s3.us-west-2.amazonaws.com   # set for MinIO/Ceph/Wasabi
    # force_path_style: false                        # true for most S3-compatible servers

    # STANDARD unless you know the object pattern suits another class. The IA and Glacier classes
    # bill a 128 KB minimum per object and a 30-day minimum duration, so a mount that writes many
    # small or short-lived files costs more on them, not less. GLACIER and DEEP_ARCHIVE objects
    # cannot be read without a restore, which ObjectFS does not perform.
    storage_tier: STANDARD

    multipart:
      threshold: 32MB                 # objects at least this large are uploaded in parts
      chunk_size: 16MB                # bytes per part; the S3 minimum for a non-final part is 5MB

performance:
  cache_size: 2GB                     # in-memory read cache
  # Pooled S3 clients, batch concurrency, and idle connections per host — one number for all three.
  connection_pool_size: 8

  # Fan a large read out into concurrent range GETs. Skipped for compressed objects, whose frames
  # cannot be sliced.
  parallel_read:
    enabled: true
    threshold: 64MB
    chunk_size: 16MB

cache:
  ttl: 5m                             # how long a cached read or attribute stays valid
  max_entries: 100000
  eviction_policy: weighted_lru       # lru, lfu, weighted_lru
  persistent_cache:
    enabled: false                    # spill the read cache to local disk
    directory: /var/cache/objectfs
    max_size: 10GB

# Durations take a unit suffix (ns, us, ms, s, m, h). A bare number is nanoseconds, so `read: 30`
# means thirty nanoseconds; that is refused at startup with the key named rather than left to fail
# later as a network timeout.
network:
  timeouts:
    connect: 10s                      # TCP dial timeout
    read: 30s                         # how long S3 has to start answering, not to finish
  retry:
    max_attempts: 3                   # ObjectFS's own retry, on top of the SDK's per-request one
    base_delay: 1s
    max_delay: 30s

# Each endpoint's address sits beside the flag that enables it, and both default to loopback because
# neither has any authentication. Set enabled: false to turn one off — there is no port value that
# means "off".
monitoring:
  metrics:
    enabled: true
    addr: 127.0.0.1:8080              # /metrics and /debug/*
  health_checks:
    enabled: true
    addr: 127.0.0.1:8081              # /health
    interval: 30s
    timeout: 5s

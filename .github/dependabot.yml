# Dependabot configuration.
#
# Three things to know before editing, all learned the hard way:
#
#  1. `time:` MUST be quoted. `time: 09:00` is not a string in YAML — it parses as an integer, and
#     Dependabot rejects the WHOLE FILE for it: "The property '#/updates/0/schedule/time' of type
#     integer did not match the following type: string", once per ecosystem. An invalid file is not
#     partially applied, it is ignored entirely, so every `labels:`, `groups:`, `reviewers:` and
#     `ignore:` block below was dead and Dependabot ran on its defaults instead. This was true from
#     2025-10-15 (d4ff903, where the key was introduced unquoted) until 2026-08-03, and it is why
#     item 2's fix did not take effect: the `automerge` label exists in .github/labels.yml and on the
#     repository, and still no Dependabot PR carried it. Two independent causes for one symptom, and
#     fixing the visible one first left the other invisible.
#
#     It reports as a failing `.github/dependabot.yml` check on every PR, which is easy to read as
#     "a dependabot job failed" rather than "the config is invalid." It is the latter.
#  2. `labels:` must name labels that EXIST. Dependabot silently drops unknown ones, so
#     `automerge` — which .github/workflows/dependabot-automerge.yml gates every approve and merge
#     step on — was never applied to a single PR. 46 PRs were opened and 0 were ever merged. Adding
#     a label here without adding it to .github/labels.yml re-breaks auto-merge silently.
#  3. Every manifest that generates a Dependabot ALERT should have an ecosystem entry here, or the
#     alert has nothing to act on it. sdks/java/pom.xml (5 alerts) and docs-platform/package.json
#     (3 alerts) sat unmonitored; GitHub opened one-off security-update jobs against them anyway,
#     which is how the missing coverage surfaced.
version: 2
updates:
  # Enable version updates for Go modules
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
  open-pull-requests-limit: 5
  reviewers:
  - scttfrdmn
  commit-message:
    prefix: deps
    include: scope
  labels:
  - dependencies
  - go
  - automerge
  groups:
    aws-sdk:
      patterns:
      - github.com/aws/aws-sdk-go-v2*
      update-types:
      - minor
      - patch
    production-dependencies:
      dependency-type: production
      update-types:
      - patch
    development-dependencies:
      dependency-type: development
      update-types:
      - minor
      - patch
  ignore:
      # Ignore major version updates for critical dependencies
  - dependency-name: github.com/aws/aws-sdk-go-v2
    update-types:
    - version-update:semver-major

  # Enable version updates for GitHub Actions
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
  open-pull-requests-limit: 5
  reviewers:
  - scttfrdmn
  commit-message:
    prefix: ci
    include: scope
  labels:
  - dependencies
  - github-actions
  - automerge
  groups:
    github-actions:
      patterns:
      - '*'
      update-types:
      - minor
      - patch

  # Enable version updates for Docker
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
  open-pull-requests-limit: 3
  reviewers:
  - scttfrdmn
  commit-message:
    prefix: docker
    include: scope
  labels:
  - dependencies
  - docker
  - automerge

  # Java SDK. Five open alerts against jackson-databind (two high) were generated here with no
  # ecosystem entry to act on them.
- package-ecosystem: maven
  directory: /sdks/java
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
  open-pull-requests-limit: 3
  reviewers:
  - scttfrdmn
  commit-message:
    prefix: deps
    include: scope
  labels:
  - dependencies
  - java
  - automerge

  # Documentation platform. Three open alerts against vite (one high).
  #
  # Note the ceiling on what this can do: no package-lock.json is committed, and for a *security*
  # update Dependabot needs one — "can't update vulnerable dependencies for projects without a
  # lockfile or pinned version requirement as the currently installed version of vite isn't known"
  # is the verbatim reason the 2026-08-02 run failed. Version updates to the `^x.y.z` ranges in
  # package.json do work. Committing a lockfile is what would close the alerts; that is #214.
- package-ecosystem: npm
  directory: /docs-platform
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
  open-pull-requests-limit: 3
  reviewers:
  - scttfrdmn
  commit-message:
    prefix: deps
    include: scope
  labels:
  - dependencies
  - javascript
  - automerge

  # JavaScript SDK. No alerts today, but ci.yml runs `npm install && npm test` in this directory
  # (ci.yml:289), so its dependencies are executed on every PR and belong under the same watch.
  #
  # The groups below exist because two of these packages cannot move alone. `npm install` enforces
  # peer ranges, so bumping half of a coupled pair fails at install time, not at test time:
  #
  #   #298  typescript 5.9.3 -> 7.0.2, alone:
  #         peer typescript@">=4.3 <7" from ts-jest@29.4.12 -> ERESOLVE, sdk-metrics fails
  #   #297  @typescript-eslint/eslint-plugin 5.62.0 -> 8.65.0, alone:
  #         peer @typescript-eslint/parser@"^8.66.0" from the plugin, while parser is still ^5.59.0
  #
  # Both are correct bumps proposed in an order that cannot install. Grouping makes Dependabot move
  # each set in one PR, which is the only form that resolves. Note this does not make the majors
  # automatic — they are still majors, so dependabot-automerge.yml comments and waits for a human.
  #
  # `typedoc` is in the typescript-toolchain group for the same reason, and it was missed the first
  # time: it constrains the TypeScript version as tightly as ts-jest does, just less visibly. The
  # regrouped #308 still failed to install because of it, which is the evidence that a group is only
  # as good as its membership. Two consequences worth knowing before touching these versions:
  #
  #   - typedoc@0.24 peers `typescript@"4.6.x || ... || 5.1.x"`, so `typescript: ^5.0.0` in
  #     package.json silently resolves to 5.1.6 — three minors behind what the range suggests.
  #   - TypeScript 7 is not reachable at any grouping. ts-jest's latest (29.4.12) peers `<7` and has
  #     no release above it. The ceiling is TypeScript 6, which typedoc@0.28 allows. See #314.
  #
  # #314 also records why none of this is caught: nothing in CI runs `tsc`, so the SDK's 48 build
  # errors are invisible and only `npm install` failures ever show up here.
- package-ecosystem: npm
  directory: /sdks/javascript
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
  open-pull-requests-limit: 3
  reviewers:
  - scttfrdmn
  commit-message:
    prefix: deps
    include: scope
  labels:
  - dependencies
  - javascript
  - automerge
  groups:
    typescript-toolchain:
      patterns:
      - typescript
      - ts-jest
      - '@types/jest'
      - jest
      - typedoc
    typescript-eslint:
      patterns:
      - '@typescript-eslint/*'
      - eslint

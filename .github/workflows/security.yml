# Security scanning. Not releases, despite the history recorded below.
#
# This file used to be called "Security & Release" and carried `build`, `docker`, and `release` jobs
# alongside the scans, triggered on `tags: [v*]` — the same trigger release.yml has. Two workflows
# publishing the same tag is a race, and the one here would have won it badly: it publishes with
# `generate_release_notes: true`, which would replace the CHANGELOG-derived notes release.yml
# assembles with an auto-generated commit list, and it built linux only, so whichever finished second
# would have decided what users could download.
#
# That race never ran, for a reason worth recording rather than relying on: GitHub set this workflow
# to `disabled_inactivity` in January 2026, which disables *every* trigger, not just the schedule. So
# it has not fired on any of the ten version tags in this repository's history — the duplicate release
# machinery was dormant, not absent, and re-enabling the workflow to get its weekly scan back would
# have silently armed it.
#
# Releases live in release.yml, which builds four platforms, verifies the tag against the version
# constant, and publishes only after every artifact exists. This file scans.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scans
  - cron: 0 2 * * 1

env:
  # Read from go.mod. It said 1.24 while go.mod said 1.26.0, so the weekly scan was analysing the
  # repository with a toolchain no other job used and no release was ever built with.
  GO_VERSION_FILE: go.mod

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run Gosec Security Scanner
      run: gosec -fmt sarif -out gosec.sarif -no-fail ./...

    - name: Fix Gosec SARIF format
      if: always()
      run: |
        # Two things GitHub's SARIF ingester rejects, both from gosec rather than from our code.
        #
        # `fixes`: gosec emits artifactChanges GitHub considers invalid. This part predates the
        # rewrite of this file and was presumably arrived at the hard way.
        #
        # Empty `artifactLocation`: gosec reports the G115 integer-conversion findings in
        # `sdks/c/main.go` with no file path at all — `"artifactLocation": {}` — and the upload then
        # fails whole with `locationFromSarifResult: expected artifact location`, discarding the other
        # ~45 findings along with them. The cause is cgo: gosec analyses the generated intermediate,
        # whose path is a `~/Library/Caches/go-build/<hash>-d` artifact, and emits nothing rather than
        # a path outside the repository.
        #
        # These are back-filled to `sdks/c/main.go` rather than dropped, which is a change of
        # position: this step used to drop them on the grounds that gosec "cannot map the location back
        # to a real file". That turned out to be half wrong, and the half that is wrong is the useful
        # half. **The line numbers are exactly right.** cgo emits `//line` directives into the
        # generated file, so the reported line is a real `main.go` line — verified by inserting eight
        # blank lines after the import block, which moved all three findings by exactly eight. Only the
        # *path* is missing, and `sdks/c` is the only cgo package in the module (`go list` over `./...`
        # reports exactly one with CgoFiles), so there is only one path it can be. Nothing is being
        # guessed at.
        #
        # Which matters because the alternative was measured and it is not "these get reviewed
        # elsewhere": golangci-lint discards the same findings for the same reason — its log says
        # `runner/invalid_issue: issue related to file <cache path> is skipped` — so dropping them here
        # left them visible to no tool at all. Three unreviewed integer conversions across a C ABI is
        # how #200's real defect survived: objectfs_put narrowed a size_t length to a C.int, so a 4 GiB
        # PUT returned OBJECTFS_OK and stored an empty object.
        #
        # Scoped to results that have a region but no uri, so a genuine gosec finding elsewhere with a
        # malformed location still gets dropped rather than silently relabelled as living in sdks/c.
        if [ -f gosec.sarif ]; then
          jq '
            del(.runs[].results[].fixes)
            | .runs[].results |= map(
                if ((.locations // []) | length) > 0
                   and ((.locations[0].physicalLocation.artifactLocation.uri // "") == "")
                   and ((.locations[0].physicalLocation.region.startLine // 0) > 0)
                then
                  .locations[0].physicalLocation.artifactLocation.uri = "sdks/c/main.go"
                else . end
              )
            | .runs[].results |= map(
                select(
                  (.locations // []) | length > 0 and
                  ((.[0].physicalLocation.artifactLocation.uri // "") != "")
                )
              )
          ' gosec.sarif > gosec-fixed.sarif
          mv gosec-fixed.sarif gosec.sarif

          echo "gosec: $(jq '[.runs[].results[]] | length' gosec.sarif) results after filtering"
          echo "gosec: $(jq '[.runs[].results[] | select(.locations[0].physicalLocation.artifactLocation.uri == "sdks/c/main.go")] | length' gosec.sarif) back-filled to sdks/c/main.go"
        fi

    # `@v4`, the floating major, not a patch pin — which is the convention for every action in this
    # repository except `trivy-action` below, and that one is pinned exactly only because it publishes
    # no major ref for `@v0.36` to resolve to. `github/codeql-action` does publish `refs/tags/v4`.
    #
    # Worth stating because Dependabot proposed `@v4.37.4` (#323) and it was already stale by review
    # time — v4.37.5 had shipped. A patch pin on three SARIF uploaders buys no safety and defers every
    # fix to the next merge, so the exactness would have been churn that also reads as deliberate to
    # the next person, the way trivy's genuinely is.
    #
    # v4's breaking changes are in the analysis actions (`init`/`analyze`) and the Node runtime;
    # `upload-sarif`'s inputs are unchanged, and all three call sites here ran green under v4.
    - name: Upload Gosec SARIF file
      uses: github/codeql-action/upload-sarif@v4.37.9
      if: always()
      with:
        sarif_file: gosec.sarif

    # Not a gate, and this is the one place that asymmetry is deliberate rather than accidental (#196).
    #
    # `scan-type: fs` over the whole repository reports on the source tree, not on what is shipped:
    # dependencies reached only by tests, files that go into no artifact, and every finding in the SDK
    # subdirectories. The gate on what is distributed is `govulncheck` below and the binary scan in
    # release.yml, both of which exit non-zero. This one uploads so the findings are visible on the
    # security tab and reviewable on their own schedule.
    #
    # Same severity floor and ignore-unfixed as the release gate, so a finding here and a finding
    # there mean the same thing — a report that includes UNKNOWN-severity noise about unfixable
    # advisories in test-only dependencies is a report nobody reads twice.
    - name: Run Trivy vulnerability scanner (repo)
      # v-prefixed: `@0.28.0` does not resolve. See the note in release.yml.
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-repo.sarif
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true

    - name: Upload Trivy repo scan results
      if: always()
      uses: github/codeql-action/upload-sarif@v4.37.9
      with:
        sarif_file: trivy-repo.sarif

    # A hard gate, and has always been one: govulncheck exits non-zero on a finding, so this has
    # gated `main` and every PR since the workflow was re-enabled. Until #196 that meant every commit
    # was gated and the release was not, which was accidental; the release now gates too.
    #
    # ./... rather than ./cmd/objectfs, unlike the license check below, and the difference is what the
    # two tools answer. govulncheck reports whether a vulnerable function is *reachable*, so a finding
    # in a test-only dependency says a test can reach it — worth knowing, and cheap to act on. The
    # license check has no such notion and had to be scoped to the artifact instead.
    #
    # It is also why `klauspost/compress` was bumped to v1.18.7 for this release: GO-2026-5841, an
    # out-of-bounds read in the s2 package, unreachable from this code but present in the module the
    # binary is built from — which is what the binary scan in release.yml sees, and what its new gate
    # would have failed on.
    - name: Check for vulnerable dependencies
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    # ./cmd/objectfs, not ./... — the check is about what we distribute.
    #
    # `./...` pulls in test-only dependencies, which ship in nothing. That is not a hypothetical
    # distinction: it failed this step on `modernc.org/mathutil`, reached only as
    # internal/testaws → substrate → sqlite → libc → mathutil, and `go list -deps ./cmd/objectfs`
    # contains zero modernc.org packages.
    #
    # The finding was also wrong on its own terms. mathutil carries a LICENSE file with a textbook
    # BSD-3-Clause — all three clauses verbatim, Apache-2.0-compatible — and go-licenses fails to
    # classify it only because the text is reflowed, wrapping mid-clause rather than matching the
    # layout its matcher expects. So the two available fixes were to add an allowlist entry
    # asserting a license this project has no standing to assert on someone else's behalf, or to
    # scope the check to the artifact whose licensing anyone can actually be bound by.
    #
    # Never reached before now: this workflow was `disabled_inactivity` from January 2026, and until
    # the govulncheck step above it was fixed, the job failed earlier every time.
    #
    # If a distributable ever includes more than this binary — a container layer, an SDK archive —
    # its packages belong on this line too.
    - name: License compliance check
      run: |
        go install github.com/google/go-licenses@latest
        go-licenses check ./cmd/objectfs

    # This is what makes a gosec finding block a merge, and it is a step in this job rather than
    # gosec's own exit status for two reasons.
    #
    # `-no-fail` has to stay. The SARIF upload needs the complete report, including the three sdks/c
    # findings the format-fix step back-fills a path onto, and dropping the flag would end the job
    # before either step ran.
    #
    # And the job name is the point. The check that used to go red on a gosec finding was `gosec`, the
    # code-scanning check derived from the upload — a different check from this job, and one that
    # appears on pull requests and not on `push: main`, measured across four commits. A required
    # context that does not always report blocks every PR forever (#413), so it could never be
    # required. `Security Scan` reports on every trigger this workflow has, which is what lets it join
    # the required list.
    #
    # Last in the job, and `if: always()`, so a new integer conversion does not also cost the run its
    # govulncheck result, its Trivy upload or its license check. Three findings reported together are
    # one round of work; the same three discovered one per push are three.
    - name: Gate on new gosec findings
      if: always()
      run: .github/scripts/gosec-gate.sh gosec.sarif .github/gosec-baseline.txt

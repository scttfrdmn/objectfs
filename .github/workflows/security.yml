# Security scanning. Not releases, despite the history recorded below.
#
# This file used to be called "Security & Release" and carried `build`, `docker`, and `release` jobs
# alongside the scans, triggered on `tags: [v*]` — the same trigger release.yml has. Two workflows
# publishing the same tag is a race, and the one here would have won it badly: it publishes with
# `generate_release_notes: true`, which would replace the CHANGELOG-derived notes release.yml
# assembles with an auto-generated commit list, and it built linux only, so whichever finished second
# would have decided what users could download.
#
# That race never ran, for a reason worth recording rather than relying on: GitHub set this workflow
# to `disabled_inactivity` in January 2026, which disables *every* trigger, not just the schedule. So
# it has not fired on any of the ten version tags in this repository's history — the duplicate release
# machinery was dormant, not absent, and re-enabling the workflow to get its weekly scan back would
# have silently armed it.
#
# Releases live in release.yml, which builds four platforms, verifies the tag against the version
# constant, and publishes only after every artifact exists. This file scans.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scans
  - cron: 0 2 * * 1

env:
  # Read from go.mod. It said 1.24 while go.mod said 1.26.0, so the weekly scan was analysing the
  # repository with a toolchain no other job used and no release was ever built with.
  GO_VERSION_FILE: go.mod

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run Gosec Security Scanner
      run: gosec -fmt sarif -out gosec.sarif -no-fail ./...

    - name: Fix Gosec SARIF format
      if: always()
      run: |
        # Remove the problematic 'fixes' field from SARIF output
        # gosec generates invalid artifactChanges that GitHub rejects
        if [ -f gosec.sarif ]; then
          jq 'del(.runs[].results[].fixes)' gosec.sarif > gosec-fixed.sarif
          mv gosec-fixed.sarif gosec.sarif
        fi

    - name: Upload Gosec SARIF file
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: gosec.sarif

    - name: Run Trivy vulnerability scanner (repo)
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-repo.sarif

    - name: Upload Trivy repo scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-repo.sarif

    - name: Check for vulnerable dependencies
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: License compliance check
      run: |
        go install github.com/google/go-licenses@latest
        go-licenses check ./...

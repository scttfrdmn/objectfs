name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sourced from go.mod so this file cannot drift from the version the module declares. The
  # previous configuration pinned 1.24.x against a `go 1.26.0` directive, which builds only
  # because setup-go silently installs a newer toolchain — so CI was not testing the version it
  # claimed to.
  GO_VERSION_FILE: go.mod

jobs:
  # ---------------------------------------------------------------------------------------------
  # test — the full suite with the race detector, not -short.
  #
  # The previous configuration ran `go test -race -short ./...`, and -short is what the harness
  # uses to skip everything that needs an S3 endpoint. So the one job that was supposed to be the
  # gate skipped the tests covering the subsystem where every proven data-loss defect lived.
  # ---------------------------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The full suite. Every test that needs an S3 endpoint gets one in-process from substrate,
      # so this needs no credentials and reaches no network.
      - name: Test
        run: go test -race -timeout 20m ./...

      # The fuse_mount tag carries the tests that need a real kernel mount — whether the kernel
      # re-reads under direct I/O, whether it keeps pages across open(2). They cannot run here:
      # ubuntu-latest runners have no /dev/fuse. They are compiled anyway, because a build tag
      # nothing compiles is exactly how four other tags in this repo came to carry code that does
      # not build (#240). This catches that in one step; #240 generalizes it to the rest.
      - name: Compile the fuse_mount tag
        run: go vet -tags=fuse_mount ./internal/fuse/

  # ---------------------------------------------------------------------------------------------
  # coverage — a floor per package, ratcheting toward 80%.
  #
  # Per-package rather than repo-wide, because a repo-wide number lets a well-tested package pay
  # for an untested one: the repo sits at 69.3% overall while internal/fuse is at 24.1%, and the
  # overall figure is the one that looks fine.
  #
  # The floors below are each package's measured coverage rounded down, so this gate starts
  # green and can only be tightened. Raising one is a deliberate act; lowering one has to be
  # justified in a diff. Packages absent from the list have no floor yet.
  # ---------------------------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Measure per-package coverage
        run: go test -covermode=atomic -coverprofile=coverage.out -timeout 20m ./...

      - name: Enforce per-package floors
        run: ./scripts/coverage-gate.sh coverage.out .coverage-floors

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  # ---------------------------------------------------------------------------------------------
  # lint — golangci-lint against the config in this repo.
  #
  # --new-from-merge-base, deliberately. The repo has ~800 findings under this configuration, most
  # of them pre-existing and many in code the refactor is about to replace; blocking every PR on
  # all of them would mean the config gets weakened until it passes, which is how a lint gate
  # becomes decorative. This gates *new* code at the full configuration and leaves the backlog to
  # be drawn down deliberately. The whole-repo number is reported below so it stays visible.
  # ---------------------------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # golangci-lint needs the merge base to diff against, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # --new-from-merge-base resolves origin/<base> with git, so the ref has to exist locally.
      # fetch-depth: 0 above fetches all branches for a push, but a pull_request checkout fetches
      # the merge ref, and the base branch is not guaranteed among them. Fetching it explicitly
      # costs seconds and removes the case where the gate silently degrades to linting everything.
      - name: Fetch the base branch for the diff
        run: git fetch --no-tags origin ${{ github.base_ref || 'main' }}

      # install-only, then invoke the binary directly in the steps below.
      #
      # Three steps here need golangci-lint and the action runs it at most once, so the version
      # is installed once and the runs are ordinary shell. The previous form had each step re-enter
      # the action and passed the whole-repo count as a bare `golangci-lint run` — which was
      # `command not found`, because nothing but the action puts it on PATH. The `|| true` on that
      # step meant a missing binary and a clean repo were the same observation.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Verify the lint configuration parses
        run: golangci-lint config verify

      - name: Lint changed code (blocking)
        run: |
          golangci-lint run \
            --new-from-merge-base=origin/${{ github.base_ref || 'main' }} \
            --timeout=10m

      - name: Whole-repo finding count (informational)
        if: always()
        run: |
          # Not a gate. It is here so the backlog has a number attached to it in every run,
          # rather than being a thing everyone knows is large and nobody can quantify.
          golangci-lint run --timeout=10m ./... 2>&1 | tail -30 || true

  # ---------------------------------------------------------------------------------------------
  # fuzz-smoke — 60 seconds per target, from the committed corpus outward.
  #
  # The corpora are committed and the ordinary `go test` run replays them, so this job is not
  # about regression: it is about finding the *next* defect. Three of the eight targets found a
  # real shipped defect within seconds of first being run, so a minute each is not a token
  # gesture.
  #
  # Each target is named explicitly rather than discovered, because `-run Fuzz -fuzz .` cannot
  # fuzz more than one target per invocation, and a loop that silently fuzzes only the first
  # match would look like coverage.
  #
  # GOMEMLIMIT is the reason this job stopped dying, and the value is not arbitrary. `go test
  # -fuzz` runs one worker *process* per CPU — four on ubuntu-latest — and each is an independent
  # Go runtime that sizes its heap against the whole machine's memory, because none of them knows
  # the other three exist. FuzzOperationSequence allocates hard (every iteration is a real
  # read-modify-write over a real HTTP endpoint), so four workers reached 6 GB of mostly-garbage
  # RSS within four seconds and the cgroup OOM-killed one: `oom_kill 1`, and `go test` reported it
  # as "fuzzing process hung or terminated unexpectedly while minimizing: EOF" against whichever
  # input that worker happened to be holding. That message names an input and writes it to
  # testdata, which is what makes this failure mode so misleading — every input so written
  # replayed green, because none of them was the problem.
  #
  # 768 MiB per worker measured at 2.9 GB peak against the runner's 16 GB, and *raised* throughput
  # from 1443 execs (the run that died) to ~21,000 in 45 s: the memory was garbage the collector
  # had no pressure signal to reclaim, not live data, so capping it costs nothing and buys back
  # the time that was going into page thrash. Measured alternatives, same 45 s budget: 384 MiB →
  # 1.4 GB peak, 13.5k execs; 1536 MiB → 5.7 GB peak, 26.1k execs. The knee is here.
  #
  # It is set for every target rather than just the one that died, because the cause is the
  # per-worker runtime's view of memory, which every target shares. A target that allocates less
  # simply never reaches the limit.
  # ---------------------------------------------------------------------------------------------
  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      GOMEMLIMIT: 768MiB
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: ./internal/vfs, target: FuzzExtentList}
          - {pkg: ./internal/vfs, target: FuzzAttrFromMetadata}
          - {pkg: ./internal/vfs, target: FuzzNodeLifecycle}
          - {pkg: ./internal/difftest, target: FuzzOperationSequence}
          - {pkg: ./internal/adapter, target: FuzzConfigConstructsBackend}
          - {pkg: ./internal/storage/s3, target: FuzzRoundTrip}
          - {pkg: ./internal/storage/s3, target: FuzzSliceRange}
          - {pkg: ./internal/storage/s3, target: FuzzGetObjectRange}
          - {pkg: ./internal/awsname, target: FuzzValidateRegion}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.pkg }} -run '^${{ matrix.target }}$' -fuzz '^${{ matrix.target }}$' -fuzztime=60s

      # A counterexample is the whole point of the job, so it has to leave the machine.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            **/testdata/fuzz/**

  # ---------------------------------------------------------------------------------------------
  # cross-build — must fail, not warn.
  #
  # The Makefile's cgofuse cross-build targets ended in `|| echo "Failed..."`, so a broken target
  # produced a green build and a line of log nobody read. Windows is deliberately absent: there is
  # no Windows FUSE binding, and a binary that cannot mount anything is not a supported target.
  # internal/fuse carries a build constraint that makes any other GOOS fail with a message naming
  # the reason.
  # ---------------------------------------------------------------------------------------------
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/objectfs

  # ---------------------------------------------------------------------------------------------
  # sdk-metrics — the two SDK suites that parse sdks/testdata/metrics-scrape.txt.
  #
  # That fixture is the contract between the Go exporter and its consumers, and the Go side of it
  # is already enforced: TestSDKFixtureMatchesTheLiveScrape regenerates the scrape and fails if it
  # has drifted. The consumer side needs this job, or the contract is only half-checked — a
  # renamed metric fails the Go suite, someone regenerates the fixture to make it pass, and the
  # SDK extractors that no longer match it stay green because nothing runs them.
  #
  # Which is not a hypothetical failure mode. It is what shipped: both SDKs parsed for metric
  # names no version of ObjectFS ever exported — cache_hits, objectfs_cache_hits_total,
  # objectfs_io_read_operations_total — and returned empty dicts to every caller in a release,
  # because no test anywhere compared what an SDK expected against what the server produced.
  #
  # `continue-on-error` is deliberately absent. These suites need no credentials, no network, and
  # no mount: they read one committed file. There is nothing here for a flake to come from.
  # ---------------------------------------------------------------------------------------------
  sdk-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # `pytest tests/` rather than the one metrics file, so tests/test_storage.py,
      # tests/test_config.py and tests/test_client.py are covered by this step as they land —
      # including the assertion that download_object leaves an existing local file intact.
      - name: Python SDK tests
        working-directory: sdks/python
        run: |
          # `-r requirements.txt` first, then the package with --no-deps, so the tree installed here
          # is the frozen one and not a fresh resolution of six `>=` floors. Before this the job
          # resolved every floor on every run, which is the defect #337 fixed for docs-site in a
          # different language: a break could appear or vanish with no commit behind it.
          #
          # --no-deps on the second line is what makes the first line authoritative. Without it pip
          # re-resolves install_requires and can move a version the requirements file pinned.
          #
          # setup.py is still installed rather than the sources being put on sys.path, and still
          # matters: the tests import objectfs.monitoring, objectfs/__init__.py imports the client,
          # and installing `.` means this job fails if setup.py stops being installable — which
          # nothing else in CI checks.
          #
          # `pip check` afterwards catches the one thing this arrangement can get wrong: a pin in
          # requirements.txt that does not satisfy install_requires. Cheap, and it fails with the
          # conflicting package named.
          pip install --quiet -r requirements.txt
          pip install --quiet --no-deps .
          pip check
          pytest tests/ -q

      # Node 22, not 20: 20 went end-of-life in April 2026, so it stops receiving security fixes
      # while this job keeps installing it. sdks/javascript declares `node >=16`, so nothing here
      # constrains the upper end — the pin was just never revisited. 22 is the active LTS.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: TypeScript SDK install
        working-directory: sdks/javascript
        # `npm ci` now that package-lock.json is committed. Without a lockfile this job resolved the
        # manifest ranges fresh on every run, so what CI tested was not what anyone had installed
        # locally, and a Dependabot alert against a transitive dependency tracked the range rather
        # than the nested copy actually in the tree — which is how one alert closed with no fix.
        run: npm ci --no-audit --no-fund

      # This step is the one that was missing, and its absence is why the SDK shipped 48 type
      # errors: `npm test` runs jest, which through ts-jest only typechecks the files a test
      # imports. src/mount.ts imports nothing testable and was never compiled by anything, so
      # src/index.ts could export `StorageAdapter` — a name that has never existed in
      # ./storage — through a release without one job noticing. `tsc` compiles src/**/*.ts
      # whether or not a test reaches it.
      #
      # Ordered before `npm test` deliberately: a type error is a clearer failure than whatever
      # a test does when the code does not typecheck.
      - name: TypeScript SDK build
        working-directory: sdks/javascript
        run: npm run build

      - name: TypeScript SDK tests
        working-directory: sdks/javascript
        # ts-jest typechecks the suite as it runs it, which is the only place *.test.ts gets
        # typechecked at all: tsconfig.json excludes **/*.test.ts from the build above.
        run: npm test

      # `npm run lint` had never run successfully anywhere: the eslintConfig in package.json
      # extended "@typescript-eslint/recommended" instead of "plugin:@typescript-eslint/recommended",
      # so eslint exited with "couldn't find the config ... to extend from" before linting a line.
      # A script that always errors and is never invoked is indistinguishable from one that passes.
      #
      # 23 no-explicit-any warnings remain and are not failures; the config sets that rule to "warn"
      # deliberately, since the SDK's public surface takes `Record<string, any>` in several places.
      # Errors are zero and this step holds that.
      - name: TypeScript SDK lint
        working-directory: sdks/javascript
        run: npm run lint

      # Java, for the same reason as the `tsc` step above and with the same history: nothing in this
      # repository had ever run Maven, and `mvn compile` failed with four errors — an import of
      # com.fasterxml.jackson.datatype.jsr310 that pom.xml did not declare, and two
      # `catch (NotFoundException | ObjectFSException e)` clauses, which is illegal because the first
      # is a subclass of the second. So the SDK had never built and its 17 tests had never run; one
      # of them was asserting a wire format okhttp does not produce.
      #
      # `mvn -B test` rather than `compile`: the tests use MockWebServer, so they need no network
      # beyond Maven's own dependency resolution and no credentials.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Java SDK build and test
        working-directory: sdks/java
        run: mvn -B test

      # C, the fourth SDK and the last one nothing in CI touched. Unlike the JavaScript and Java
      # cases, it does build — `go build ./...` compiles the cgo Go side because sdks/c is a package
      # of the main module. What no job did was link a C program against the shared library and run
      # it, so objectfs.h, objectfs_types.h and the 21 assertions in tests/test_basic.c were
      # unverified: the header could declare a prototype the library does not export, or a struct
      # field too narrow for the value written into it, and every job would stay green.
      #
      # Which is what had happened. objectfs_info_t.key was char[1024] against an S3 key limit of
      # 1024 bytes — one byte short of holding a legal maximum-length key with its terminator — and
      # objectfs_last_error's freed-handle arm returned a fresh malloc under a header that promises
      # the caller must not free it.
      #
      # `make test` builds the library, compiles tests/test_basic.c against the public header, and
      # runs both that binary and the Python ctypes smoke test. The integration halves of both skip
      # themselves without OBJECTFS_TEST_BUCKET, so this needs no credentials and reaches no network.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: C SDK build and test
        working-directory: sdks/c
        run: make test

  # ---------------------------------------------------------------------------------------------
  # docs-site — `vitepress build` on docs-platform/, which nothing had ever run.
  #
  # Same shape as the four SDK gates above, and the same lesson: the tree could not build, and had
  # not been able to for its whole history, because no job invoked the builder. Three independent
  # causes had accumulated behind that silence, and each one was only visible once the previous was
  # fixed — which is the argument for the gate rather than for the three fixes:
  #
  #   1. `.vitepress/theme/index.js` imported three .vue components that have never existed in this
  #      repository (`git log --all` finds no history for any of them). A missing import is a hard
  #      rollup error, so this alone broke every page.
  #   2. `README.md` nested a ```python fence inside a ```markdown fence of equal length, so the
  #      inner fence closed the outer block and `</CodeRunner>` reached the Vue compiler as a stray
  #      tag. Reported as `Invalid end tag` at a column in the middle of a heading, which points
  #      nowhere near the cause.
  #   3. `[LICENSE](../LICENSE)` leaves the site root. Correct on GitHub, a dead link to the
  #      builder, and dead links fail the build.
  #
  # `npm ci`, against the package-lock.json this directory now commits (#214). It used to be
  # `npm install`, which resolved the manifest ranges fresh on every run — so the job tested a
  # dependency tree no reader could reproduce, and a break could appear or vanish with no commit
  # behind it. The lockfile is also what Dependabot needs to determine an installed version, which
  # is why the npm *security* updates for this directory could not apply before it existed.
  #
  # The site is not published by anything, so this gates content rather than a deploy. It earns its
  # place anyway: these pages are read on GitHub whether or not the site renders, and a tree that
  # cannot build is a tree where nobody notices the next thing that breaks.
  # ---------------------------------------------------------------------------------------------
  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs-platform dependencies
        working-directory: docs-platform
        run: npm ci --no-audit --no-fund

      - name: Build documentation site
        working-directory: docs-platform
        run: npx vitepress build .

  # ---------------------------------------------------------------------------------------------
  # config-examples — every config file this repository publishes, in a file or in a doc, must
  # load against the schema and must actually change something.
  #
  # configs/example.yaml — the file the README told users to copy, and the file postinstall.sh
  # installs as /etc/objectfs/config.yaml — was 162 lines of which exactly one field differed from
  # the built-in defaults, and nothing read that field. It opened with a top-level `s3:` block
  # where the schema has `storage.s3`, so `region: us-west-2` loaded as `us-east-1`. That is also
  # why its compression block documented `enable`/`zstd_level`/`min_file_size` against the real
  # `enabled`/`level`/`min_size` and nobody noticed: the whole block was already inert, so
  # correcting the names would not have changed the behavior either.
  #
  # This job is its own job rather than a line in the test suite because it is the check whose
  # failure a reviewer most needs named. The loader is strict now, so a shipped file with an
  # unknown key fails; the effect assertion additionally fails a file that parses cleanly and
  # leaves every value at its default, which strict decoding cannot see; and the documentation
  # check extends both to every YAML block in every markdown file, because a block captioned
  # `# /etc/objectfs/config.yaml` is a file a user will copy too.
  # ---------------------------------------------------------------------------------------------
  config-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Load and validate every shipped and documented config
        run: |
          go test ./internal/config/ -v \
            -run 'TestShippedConfigs|TestDocumentedConfigYAML|TestLoadFromFile|TestTopLevelKeys'

  # ---------------------------------------------------------------------------------------------
  # systemd-unit — configs/systemd/objectfs@.service, which operators are told to install.
  #
  # Two halves, and they check different things. `go test` checks that every objectfs command line
  # in the unit uses a subcommand the binary dispatches and flags it parses, with both sets scraped
  # from cmd/objectfs/main.go — that runs on every platform and needs no systemd.
  # `systemd-analyze verify` checks the other half, that the file is well-formed systemd, and it
  # needs a Linux runner with systemd installed, which is what this job is for.
  #
  # Neither half alone is enough, and the unit that shipped before v0.11.0 is the demonstration:
  # `ExecStart=/usr/local/bin/objectfs s3://%i /mnt/objectfs/%i` and
  # `ExecStop=/bin/fusermount3 -u /mnt/objectfs/%i` are both perfectly valid systemd — analyze
  # passes them — while the first makes the instance name and the bucket name one string and the
  # second calls a program that is absent on a minimal image, where its failure becomes a SIGKILL
  # through buffered writes after TimeoutStopSec.
  #
  # Verified as objectfs@example.service rather than as the template, because the unit is a template
  # and %i has no value until one is named — checking the uninstantiated form would check a file
  # whose ExecStart, ExecStop, and ReadWritePaths all still contain an unexpanded specifier.
  # ---------------------------------------------------------------------------------------------
  systemd-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: The unit calls the binary the binary actually is
        run: go test ./internal/config/ -v -run 'TestSystemdUnit'

      - name: The unit is well-formed systemd
        run: |
          # ExecStart's binary does not exist on the runner and ExecStartPre's directories are not
          # creatable, so analyze reports those as warnings on stderr. Its exit code covers syntax
          # and directive validity, which is the half being checked here; a stub binary at the
          # unit's own path silences the executable-not-found line so a real error stands out.
          sudo install -d /usr/bin
          sudo tee /usr/bin/objectfs >/dev/null <<'STUB'
          #!/bin/sh
          exit 0
          STUB
          sudo chmod +x /usr/bin/objectfs

          sudo cp configs/systemd/objectfs@.service /etc/systemd/system/
          systemd-analyze verify /etc/systemd/system/objectfs@example.service

  # ---------------------------------------------------------------------------------------------
  # labels — .github/labels.yml against the labels the repository actually has, both directions.
  #
  # Its own job because it is the one gate here that needs the GitHub API, and because a failure
  # names an action outside the codebase: add a label to the file, or delete one from the
  # repository. Nothing in a diff can tell a reviewer that.
  #
  # Not keyed on labels.yml changing, which is what #190 proposed. Every drift this repository has
  # had originated on GitHub — two labels created in the web UI, one invented by `gh issue create
  # --label`, six GitHub defaults never deleted — and none of those events touches the file, so a
  # `paths:` filter would have fired on exactly zero of the nine. Verified with `git log -S` for
  # the exact `- name:` form of each.
  # ---------------------------------------------------------------------------------------------
  labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # The API half of the gate skips when gh cannot reach the API, which is right for a laptop and
      # wrong here: a skipped gate reports success. So the output is checked for the skip, because
      # `go test` exits 0 either way and this job exists to be the one place that cannot happen.
      - name: Label taxonomy matches the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          go test ./internal/config/ -v \
            -run 'TestLabelsYAMLIsWellFormed|TestLabelsYAMLMatchesTheRepository|TestDependabotLabelsAreDefined|TestSyncLabelsScriptCanParseTheFile' \
            2>&1 | tee labels.log

          if grep -q 'SKIP.*TestLabelsYAMLMatchesTheRepository' labels.log; then
            echo "::error::the label comparison skipped instead of running, so this job checked" \
              "only the offline half. gh could not reach the API — that is a CI configuration" \
              "failure, not a pass."
            exit 1
          fi

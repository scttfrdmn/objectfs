name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sourced from go.mod so this file cannot drift from the version the module declares. The
  # previous configuration pinned 1.24.x against a `go 1.26.0` directive, which builds only
  # because setup-go silently installs a newer toolchain — so CI was not testing the version it
  # claimed to.
  GO_VERSION_FILE: go.mod

jobs:
  # ---------------------------------------------------------------------------------------------
  # test — the full suite with the race detector, not -short.
  #
  # The previous configuration ran `go test -race -short ./...`, and -short is what the harness
  # uses to skip everything that needs an S3 endpoint. So the one job that was supposed to be the
  # gate skipped the tests covering the subsystem where every proven data-loss defect lived.
  # ---------------------------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

      # The full suite. Every test that needs an S3 endpoint gets one in-process from substrate,
      # so this needs no credentials and reaches no network.
    - name: Test
      run: go test -race -timeout 20m ./...

  # ---------------------------------------------------------------------------------------------
  # build-tags — compile every build tag in the repo.
  #
  # A build tag is invisible to `go build ./...`, `go vet ./...`, and `go test ./...`: the files
  # behind it are not in the default build, so nothing type-checks them. Four of this repo's
  # tags had rotted through that gap by v0.15.0 (#240) — `aws_s3` and `integration` were calling
  # a three-argument PutObject that had grown a fourth parameter, `benchmark` called a function
  # that does not exist (`fmt.Itoa`), and `posix` was several API generations stale. Each was
  # written to pass, committed green, and then silently stopped compiling as the code beneath it
  # moved. No test failed, because no test was ever built.
  #
  # Vet rather than test, deliberately. Several of these suites need real AWS credentials, a
  # bucket, or a /dev/fuse device, and they correctly refuse to run without one. *Compiling*
  # them needs nothing — and compiling is the thing that was missing. This gate says only "the
  # code behind this tag is still valid Go against today's APIs", which is exactly the claim
  # that had quietly become false.
  #
  # The tag list must stay complete. `TestEveryBuildTagIsGated` in internal/config walks every
  # //go:build line in the repo and fails if one names a tag absent from the matrix below, so a
  # new tag cannot be introduced without a cell to compile it. That test is the reason this list
  # can be trusted rather than merely hoped to be current.
  # ---------------------------------------------------------------------------------------------
  build-tags:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # fuse_mount carries the tests that need a real kernel mount — whether the kernel
        # re-reads under direct I/O, whether it keeps pages across open(2). ubuntu-latest has no
        # /dev/fuse, so they cannot run here; they are compiled here.
        # s3compat carries the conditional-write compatibility suite: it needs a MinIO, Ceph RGW or
        # Wasabi endpoint in OBJECTFS_COMPAT_ENDPOINT and skips without one. Its findings are what
        # docs/design/conditional-write-compatibility.md records, and two of that matrix's rows were
        # wrong while they were documentation reads rather than probe results — so the suite is the
        # artifact, and compiling it is what keeps it runnable.
        tag: [aws_s3, benchmark, distributed, e2e, integration, fuse_mount, s3compat]
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Compile the ${{ matrix.tag }} tag
      run: go vet -tags=${{ matrix.tag }} ./...

  # ---------------------------------------------------------------------------------------------
  # coverage — a floor per package, ratcheting toward 80%.
  #
  # Per-package rather than repo-wide, because a repo-wide number lets a well-tested package pay
  # for an untested one: the repo sits at 69.3% overall while internal/fuse is at 24.1%, and the
  # overall figure is the one that looks fine.
  #
  # The floors below are each package's measured coverage rounded down, so this gate starts
  # green and can only be tightened. Raising one is a deliberate act; lowering one has to be
  # justified in a diff. Packages absent from the list have no floor yet.
  # ---------------------------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

      # CGO_ENABLED is stated rather than inherited (#361). It was neither set nor unset here, so the
      # job took the runner's default of cgo *on*, and sdks/c — the one package whose coverage depends
      # on it — appeared in the profile at 11.0% because of that default rather than because of a
      # decision. A floor read off an inherited value is a claim about a configuration no workflow
      # states.
      #
      # On, not off, and the direction matters. sdks/c/main.go carries `import "C"`, so with cgo off
      # the package does not fall back to a build-tag-excluded variant — `go test` fails to compile,
      # because main_test.go references codeFromErr and fillCStr and neither declaration is built.
      # CGO_ENABLED=0 here would turn a coverage question into a compile failure in the job whose
      # output is a coverage number, which is a much worse failure to read. The cross-build matrix and
      # the release build set 0 deliberately, because there the point is a static binary; here the
      # point is measuring every package, so the value that compiles every package is the right one.
    - name: Measure per-package coverage
      env:
        CGO_ENABLED: 1
      run: go test -covermode=atomic -coverprofile=coverage.out -timeout 20m ./...

    - name: Enforce per-package floors
      run: ./scripts/coverage-gate.sh coverage.out .coverage-floors

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: coverage.out

  # ---------------------------------------------------------------------------------------------
  # lint — golangci-lint against the config in this repo.
  #
  # --new-from-merge-base, deliberately. The repo has ~800 findings under this configuration, most
  # of them pre-existing and many in code the refactor is about to replace; blocking every PR on
  # all of them would mean the config gets weakened until it passes, which is how a lint gate
  # becomes decorative. This gates *new* code at the full configuration and leaves the backlog to
  # be drawn down deliberately. The whole-repo number is reported below so it stays visible.
  # ---------------------------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
          # golangci-lint needs the merge base to diff against, which a shallow clone does not have.
        fetch-depth: 0

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

      # --new-from-merge-base resolves origin/<base> with git, so the ref has to exist locally.
      # fetch-depth: 0 above fetches all branches for a push, but a pull_request checkout fetches
      # the merge ref, and the base branch is not guaranteed among them. Fetching it explicitly
      # costs seconds and removes the case where the gate silently degrades to linting everything.
    - name: Fetch the base branch for the diff
      run: git fetch --no-tags origin ${{ github.base_ref || 'main' }}

      # install-only, then invoke the binary directly in the steps below.
      #
      # Three steps here need golangci-lint and the action runs it at most once, so the version
      # is installed once and the runs are ordinary shell. The previous form had each step re-enter
      # the action and passed the whole-repo count as a bare `golangci-lint run` — which was
      # `command not found`, because nothing but the action puts it on PATH. The `|| true` on that
      # step meant a missing binary and a clean repo were the same observation.
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        install-only: true

    - name: Verify the lint configuration parses
      run: golangci-lint config verify

    - name: Lint changed code (blocking)
      run: |
        golangci-lint run \
          --new-from-merge-base=origin/${{ github.base_ref || 'main' }} \
          --timeout=10m

    - name: Whole-repo finding count (informational)
      if: always()
      run: |
        # Not a gate. It is here so the backlog has a number attached to it in every run,
        # rather than being a thing everyone knows is large and nobody can quantify.
        golangci-lint run --timeout=10m ./... 2>&1 | tail -30 || true

  # ---------------------------------------------------------------------------------------------
  # fuzz-smoke — 60 seconds per target, from the committed corpus outward.
  #
  # The corpora are committed and the ordinary `go test` run replays them, so this job is not
  # about regression: it is about finding the *next* defect. Four of the ten targets found a
  # real defect within seconds of first being run, so a minute each is not a token gesture. The
  # most recent, FuzzNewConfig, took 0.37 s to find a config that panicked the process — Period=2ns
  # made RenewInterval default to Period/4 = 0 by integer division, and time.NewTicker(0) panics
  # inside a goroutine no caller can recover from. It found that before it was ever committed,
  # which is the argument for adding a target with each package rather than after a defect.
  #
  # Each target is named explicitly rather than discovered, because `-run Fuzz -fuzz .` cannot
  # fuzz more than one target per invocation, and a loop that silently fuzzes only the first
  # match would look like coverage.
  #
  # GOMEMLIMIT is the reason this job stopped dying, and the value is not arbitrary. `go test
  # -fuzz` runs one worker *process* per CPU — four on ubuntu-latest — and each is an independent
  # Go runtime that sizes its heap against the whole machine's memory, because none of them knows
  # the other three exist. FuzzOperationSequence allocates hard (every iteration is a real
  # read-modify-write over a real HTTP endpoint), so four workers reached 6 GB of mostly-garbage
  # RSS within four seconds and the cgroup OOM-killed one: `oom_kill 1`, and `go test` reported it
  # as "fuzzing process hung or terminated unexpectedly while minimizing: EOF" against whichever
  # input that worker happened to be holding. That message names an input and writes it to
  # testdata, which is what makes this failure mode so misleading — every input so written
  # replayed green, because none of them was the problem.
  #
  # 768 MiB per worker measured at 2.9 GB peak against the runner's 16 GB, and *raised* throughput
  # from 1443 execs (the run that died) to ~21,000 in 45 s: the memory was garbage the collector
  # had no pressure signal to reclaim, not live data, so capping it costs nothing and buys back
  # the time that was going into page thrash. Measured alternatives, same 45 s budget: 384 MiB →
  # 1.4 GB peak, 13.5k execs; 1536 MiB → 5.7 GB peak, 26.1k execs. The knee is here.
  #
  # It is set for every target rather than just the one that died, because the cause is the
  # per-worker runtime's view of memory, which every target shares. A target that allocates less
  # simply never reaches the limit.
  #
  # The step runs through .github/scripts/fuzz-smoke.sh rather than calling `go test` directly,
  # because `go test -fuzz` exits non-zero for two unrelated reasons and this job has to tell them
  # apart: it found a counterexample (fail the build), or its own coordinator lost a shutdown race
  # / the runner was preempted (neither is a property of the code under test). ~1 run in 10 was the
  # latter — see #218 for the race in $GOROOT/src/internal/fuzz/fuzz.go and the standalone
  # reproduction. The script keys on the presence of a counterexample, never on the exit status
  # alone, and the reasoning for each tolerated shape is in its header.
  # ---------------------------------------------------------------------------------------------
  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      GOMEMLIMIT: 768MiB
    strategy:
      fail-fast: false
      matrix:
        include:
        - {pkg: ./internal/vfs, target: FuzzExtentList}
        - {pkg: ./internal/vfs, target: FuzzAttrFromMetadata}
        - {pkg: ./internal/vfs, target: FuzzNodeLifecycle}
        - {pkg: ./internal/difftest, target: FuzzOperationSequence}
        - {pkg: ./internal/adapter, target: FuzzConfigConstructsBackend}
        - {pkg: ./internal/storage/s3, target: FuzzRoundTrip}
        - {pkg: ./internal/storage/s3, target: FuzzSliceRange}
        - {pkg: ./internal/storage/s3, target: FuzzGetObjectRange}
        - {pkg: ./internal/awsname, target: FuzzValidateRegion}
        - {pkg: ./internal/coord, target: FuzzNewConfig}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Fuzz ${{ matrix.target }}
      run: .github/scripts/fuzz-smoke.sh '${{ matrix.pkg }}' '${{ matrix.target }}' 60

      # A counterexample is the whole point of the job, so it has to leave the machine.
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: fuzz-failure-${{ matrix.target }}
        path: |
          **/testdata/fuzz/**

  # ---------------------------------------------------------------------------------------------
  # cross-build — must fail, not warn.
  #
  # The Makefile's cgofuse cross-build targets ended in `|| echo "Failed..."`, so a broken target
  # produced a green build and a line of log nobody read. Windows is deliberately absent: there is
  # no Windows FUSE binding, and a binary that cannot mount anything is not a supported target.
  # internal/fuse carries a build constraint that makes any other GOOS fail with a message naming
  # the reason.
  #
  # The 32-bit cells (linux/arm, linux/386) are here because a whole word width was missing from the
  # matrix, and `int` is 32 bits wide on those targets. `safeIntToUint32` guarded its conversion with
  # `i > 0xFFFFFFFF` — a constant that does not fit a 32-bit `int` — so `internal/fuse` did not
  # compile for any of them. On this matrix as it stood, that was invisible: every cell was 64-bit,
  # every cell was green, and no test on a 64-bit host can see the difference either, because the
  # defect is a compile error rather than a wrong answer. linux/armv7 was dropped from the release
  # matrix rather than fixed as a result (#198).
  #
  # The vet step is what covers _test.go files. `go build` does not compile them, so a width bug in a
  # test — `int(math.MaxUint32)` is the same error in the same shape — would still slip through a
  # green build cell. Scoped to the first-party non-cgo trees: `sdks/c` is cgo and cannot be vetted
  # under CGO_ENABLED=0 for any target (#200 covers that surface separately).
  # ---------------------------------------------------------------------------------------------
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - {goos: linux, goarch: amd64}
        - {goos: linux, goarch: arm64}
        - {goos: linux, goarch: arm, goarm: '7'}
        - {goos: linux, goarch: '386'}
        - {goos: darwin, goarch: amd64}
        - {goos: darwin, goarch: arm64}
    steps:
    - uses: actions/checkout@v7

      # setup-go runs before GOOS/GOARCH are in scope, deliberately: those are set per step below
      # rather than on the job, so nothing about the toolchain install or its cache keys is asked to
      # reason about a cross-compilation target.
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
          # Empty for every non-arm cell, which the toolchain ignores.
        GOARM: ${{ matrix.goarm }}
      run: go build ./cmd/objectfs

    - name: Type-check tests for ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
      run: go vet ./internal/... ./pkg/... ./cmd/...

  # ---------------------------------------------------------------------------------------------
  # sdk-metrics — the two SDK suites that parse sdks/testdata/metrics-scrape.txt.
  #
  # That fixture is the contract between the Go exporter and its consumers, and the Go side of it
  # is already enforced: TestSDKFixtureMatchesTheLiveScrape regenerates the scrape and fails if it
  # has drifted. The consumer side needs this job, or the contract is only half-checked — a
  # renamed metric fails the Go suite, someone regenerates the fixture to make it pass, and the
  # SDK extractors that no longer match it stay green because nothing runs them.
  #
  # Which is not a hypothetical failure mode. It is what shipped: both SDKs parsed for metric
  # names no version of ObjectFS ever exported — cache_hits, objectfs_cache_hits_total,
  # objectfs_io_read_operations_total — and returned empty dicts to every caller in a release,
  # because no test anywhere compared what an SDK expected against what the server produced.
  #
  # `continue-on-error` is deliberately absent. These suites need no credentials, no network, and
  # no mount: they read one committed file. There is nothing here for a flake to come from.
  # ---------------------------------------------------------------------------------------------
  sdk-metrics:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

      # `pytest tests/` rather than the one metrics file, so tests/test_storage.py,
      # tests/test_config.py and tests/test_client.py are covered by this step as they land —
      # including the assertion that download_object leaves an existing local file intact.
      #
      # tests/test_config.py carries a second cross-language contract in the other direction, and
      # this step is the half that enforces it. sdks/testdata/presets/*.yaml is what
      # Configuration.to_yaml() emits, committed, and internal/config's
      # TestSDKPresetsLoadUnderTheGoLoader puts every one through the Go loader. Because that Go test
      # reads committed files, it would stay green on stale ones — so the Python test compares rather
      # than writes, and a config.py change that is not regenerated fails here. Without both halves
      # the gate asserts against whatever was committed last, which is the shape of the defect it
      # exists to catch (#385): to_yaml emitted sixteen keys the Go schema does not define, and
      # save_to_file wrote a document the daemon refused at startup.
    - name: Python SDK tests
      working-directory: sdks/python
      run: |
        # `-r requirements.txt` first, then the package with --no-deps, so the tree installed here
        # is the frozen one and not a fresh resolution of six `>=` floors. Before this the job
        # resolved every floor on every run, which is the defect #337 fixed for docs-site in a
        # different language: a break could appear or vanish with no commit behind it.
        #
        # --no-deps on the second line is what makes the first line authoritative. Without it pip
        # re-resolves install_requires and can move a version the requirements file pinned.
        #
        # setup.py is still installed rather than the sources being put on sys.path, and still
        # matters: the tests import objectfs.monitoring, objectfs/__init__.py imports the client,
        # and installing `.` means this job fails if setup.py stops being installable — which
        # nothing else in CI checks.
        #
        # `pip check` afterwards catches the one thing this arrangement can get wrong: a pin in
        # requirements.txt that does not satisfy install_requires. Cheap, and it fails with the
        # conflicting package named.
        pip install --quiet -r requirements.txt
        pip install --quiet --no-deps .
        pip check
        pytest tests/ -q

      # Node 22, not 20: 20 went end-of-life in April 2026, so it stops receiving security fixes
      # while this job keeps installing it. sdks/javascript declares `node >=16`, so nothing here
      # constrains the upper end — the pin was just never revisited. 22 is the active LTS.
    - uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: TypeScript SDK install
      working-directory: sdks/javascript
        # `npm ci` now that package-lock.json is committed. Without a lockfile this job resolved the
        # manifest ranges fresh on every run, so what CI tested was not what anyone had installed
        # locally, and a Dependabot alert against a transitive dependency tracked the range rather
        # than the nested copy actually in the tree — which is how one alert closed with no fix.
      run: npm ci --no-audit --no-fund

      # This step is the one that was missing, and its absence is why the SDK shipped 48 type
      # errors: `npm test` runs jest, which through ts-jest only typechecks the files a test
      # imports. src/mount.ts imports nothing testable and was never compiled by anything, so
      # src/index.ts could export `StorageAdapter` — a name that has never existed in
      # ./storage — through a release without one job noticing. `tsc` compiles src/**/*.ts
      # whether or not a test reaches it.
      #
      # Ordered before `npm test` deliberately: a type error is a clearer failure than whatever
      # a test does when the code does not typecheck.
    - name: TypeScript SDK build
      working-directory: sdks/javascript
      run: npm run build

    - name: TypeScript SDK tests
      working-directory: sdks/javascript
        # ts-jest typechecks the suite as it runs it, which is the only place *.test.ts gets
        # typechecked at all: tsconfig.json excludes **/*.test.ts from the build above.
      run: npm test

      # `npm run lint` had never run successfully anywhere: the eslintConfig in package.json
      # extended "@typescript-eslint/recommended" instead of "plugin:@typescript-eslint/recommended",
      # so eslint exited with "couldn't find the config ... to extend from" before linting a line.
      # A script that always errors and is never invoked is indistinguishable from one that passes.
      #
      # 23 no-explicit-any warnings remain and are not failures; the config sets that rule to "warn"
      # deliberately, since the SDK's public surface takes `Record<string, any>` in several places.
      # Errors are zero and this step holds that.
    - name: TypeScript SDK lint
      working-directory: sdks/javascript
      run: npm run lint

      # Java, for the same reason as the `tsc` step above and with the same history: nothing in this
      # repository had ever run Maven, and `mvn compile` failed with four errors — an import of
      # com.fasterxml.jackson.datatype.jsr310 that pom.xml did not declare, and two
      # `catch (NotFoundException | ObjectFSException e)` clauses, which is illegal because the first
      # is a subclass of the second. So the SDK had never built and its 17 tests had never run; one
      # of them was asserting a wire format okhttp does not produce.
      #
      # `mvn -B test` rather than `compile`: the tests use MockWebServer, so they need no network
      # beyond Maven's own dependency resolution and no credentials.
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    - name: Java SDK build and test
      working-directory: sdks/java
      run: mvn -B test

      # C, the fourth SDK and the last one nothing in CI touched. Unlike the JavaScript and Java
      # cases, it does build — `go build ./...` compiles the cgo Go side because sdks/c is a package
      # of the main module. What no job did was link a C program against the shared library and run
      # it, so objectfs.h, objectfs_types.h and the 21 assertions in tests/test_basic.c were
      # unverified: the header could declare a prototype the library does not export, or a struct
      # field too narrow for the value written into it, and every job would stay green.
      #
      # Which is what had happened. objectfs_info_t.key was char[1024] against an S3 key limit of
      # 1024 bytes — one byte short of holding a legal maximum-length key with its terminator — and
      # objectfs_last_error's freed-handle arm returned a fresh malloc under a header that promises
      # the caller must not free it.
      #
      # `make test` builds the library, compiles tests/test_basic.c against the public header, and
      # runs both that binary and the Python ctypes smoke test. The integration halves of both skip
      # themselves without OBJECTFS_TEST_BUCKET, so this needs no credentials and reaches no network.
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: C SDK build and test
      working-directory: sdks/c
      run: make test

  # ---------------------------------------------------------------------------------------------
  # docs-site — `vitepress build` on docs-platform/, which nothing had ever run.
  #
  # Same shape as the four SDK gates above, and the same lesson: the tree could not build, and had
  # not been able to for its whole history, because no job invoked the builder. Three independent
  # causes had accumulated behind that silence, and each one was only visible once the previous was
  # fixed — which is the argument for the gate rather than for the three fixes:
  #
  #   1. `.vitepress/theme/index.js` imported three .vue components that have never existed in this
  #      repository (`git log --all` finds no history for any of them). A missing import is a hard
  #      rollup error, so this alone broke every page.
  #   2. `README.md` nested a ```python fence inside a ```markdown fence of equal length, so the
  #      inner fence closed the outer block and `</CodeRunner>` reached the Vue compiler as a stray
  #      tag. Reported as `Invalid end tag` at a column in the middle of a heading, which points
  #      nowhere near the cause.
  #   3. `[LICENSE](../LICENSE)` leaves the site root. Correct on GitHub, a dead link to the
  #      builder, and dead links fail the build.
  #
  # `npm ci`, against the package-lock.json this directory now commits (#214). It used to be
  # `npm install`, which resolved the manifest ranges fresh on every run — so the job tested a
  # dependency tree no reader could reproduce, and a break could appear or vanish with no commit
  # behind it. The lockfile is also what Dependabot needs to determine an installed version, which
  # is why the npm *security* updates for this directory could not apply before it existed.
  #
  # The site is not published by anything, so this gates content rather than a deploy. It earns its
  # place anyway: these pages are read on GitHub whether or not the site renders, and a tree that
  # cannot build is a tree where nobody notices the next thing that breaks.
  #
  # It gates a site and nothing else, as of #336. `docs-platform` also carried an Express server, two
  # Vue components that called it, a Dockerfile, and a seven-service docker-compose.yml — and this
  # job could not have caught any of it, because `vitepress build` does not read them. The components
  # in particular *built* fine and were inert at runtime, which is the failure this gate is blind to
  # by construction. That surface is deleted rather than given jobs of its own; what a gate cannot
  # see, it cannot hold.
  # ---------------------------------------------------------------------------------------------
  docs-site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install docs-platform dependencies
      working-directory: docs-platform
      run: npm ci --no-audit --no-fund

    - name: Build documentation site
      working-directory: docs-platform
      run: npx vitepress build .

  # ---------------------------------------------------------------------------------------------
  # config-examples — every config file this repository publishes, in a file or in a doc, must
  # load against the schema and must actually change something.
  #
  # configs/example.yaml — the file the README told users to copy, and the file postinstall.sh
  # installs as /etc/objectfs/config.yaml — was 162 lines of which exactly one field differed from
  # the built-in defaults, and nothing read that field. It opened with a top-level `s3:` block
  # where the schema has `storage.s3`, so `region: us-west-2` loaded as `us-east-1`. That is also
  # why its compression block documented `enable`/`zstd_level`/`min_file_size` against the real
  # `enabled`/`level`/`min_size` and nobody noticed: the whole block was already inert, so
  # correcting the names would not have changed the behavior either.
  #
  # This job is its own job rather than a line in the test suite because it is the check whose
  # failure a reviewer most needs named. The loader is strict now, so a shipped file with an
  # unknown key fails; the effect assertion additionally fails a file that parses cleanly and
  # leaves every value at its default, which strict decoding cannot see; and the documentation
  # check extends both to every YAML block in every markdown file, because a block captioned
  # `# /etc/objectfs/config.yaml` is a file a user will copy too.
  # ---------------------------------------------------------------------------------------------
  config-examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Load and validate every shipped and documented config
      run: |
        go test ./internal/config/ -v \
          -run 'TestShippedConfigs|TestDocumentedConfigYAML|TestLoadFromFile|TestTopLevelKeys'

  # ---------------------------------------------------------------------------------------------
  # deploy-manifests — deploy/kubernetes/ and deploy/docker/, which operators are told to apply.
  #
  # The same two-halves structure as systemd-unit below, for the same reason and against the same
  # defect. `go test` checks that every objectfs command line in a manifest uses a subcommand the
  # binary dispatches and flags it parses, that every OBJECTFS_* name is read by something, and that
  # the ConfigMap's embedded config survives the real strict unmarshal. This job adds the half that
  # needs tools rather than Go: schema validation and the Compose parser.
  #
  # Neither half is enough alone, and the shape of what each one misses is worth naming. kubeconform
  # approves any string in an `args:` list, so a container invoking a subcommand that does not exist
  # is schema-valid — exactly the hole `systemd-analyze verify` left in the shipped unit for a year.
  # Conversely `go test` cannot know whether a manifest is valid Kubernetes at all: it reads the
  # files as text and as loose YAML, so a misplaced key under `spec:` or a probe field that moved
  # between API versions passes it and fails `kubectl apply`.
  #
  # -strict, which rejects unknown fields. Without it a typo'd field name is silently ignored by the
  # validator exactly as it is by the API server, which is the failure this is here to catch: a
  # `terminationGracePeriodSecond` (singular) would leave the default 30s in place, and 30s is the
  # value that SIGKILLs a mount through buffered writes.
  #
  # `docker compose config` is the Compose half, and it is not a formality — it caught a real defect
  # in this file's own placeholder secret, where 64 unquoted zeros parsed as the integer 0 and
  # rendered back as "0", a one-byte secret failing minSecretLen with nothing in the file appearing
  # to set it. It also expands the YAML anchors, which is the only way to confirm the three nodes end
  # up with three distinct identities rather than three copies of node 1's.
  #
  # What this job deliberately does not do: apply anything. That needs a cluster and a FUSE-capable
  # runner, and it is worth having as its own job rather than as a half-measure here.
  # ---------------------------------------------------------------------------------------------
  deploy-manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: The manifests name env vars the binary reads and flags it parses
      run: go test ./internal/config/ -v -run 'TestDeploy'

    - name: The Kubernetes manifests are valid, with no unknown fields
      run: |
        # Pinned by version rather than tracking latest: this validates against bundled schemas, and a
        # validator that changes under the repository would turn an unrelated PR red.
        curl -fsSL \
          https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
          | tar -xz kubeconform
        ./kubeconform -strict -summary deploy/kubernetes/

    - name: The Compose file parses, and the three nodes get three identities
      run: |
        docker compose -f deploy/docker/docker-compose.yaml config > /tmp/compose-resolved.yaml

        # The anchors are what make one node definition serve three, so the thing worth asserting is
        # that they produced three *different* node IDs. A merge key that overrode the wrong field, or
        # an override accidentally deleted, yields three nodes claiming the same identity in gossip —
        # which is a cluster that forms and then disagrees about who owns what, not one that fails.
        ids=$(grep -c 'OBJECTFS_CLUSTER_NODE_ID' /tmp/compose-resolved.yaml)
        distinct=$(grep 'OBJECTFS_CLUSTER_NODE_ID' /tmp/compose-resolved.yaml | sort -u | wc -l)
        if [ "$ids" != "3" ] || [ "$distinct" != "3" ]; then
          echo "::error::expected 3 nodes with 3 distinct OBJECTFS_CLUSTER_NODE_ID values, got" \
            "$ids nodes and $distinct distinct. Two nodes sharing an identity is a cluster that" \
            "forms and then disagrees about who owns which key."
          grep 'OBJECTFS_CLUSTER_NODE_ID' /tmp/compose-resolved.yaml
          exit 1
        fi

        # The placeholder secret must survive YAML as a string of usable length. 64 unquoted zeros
        # became the integer 0 here once; minSecretLen is 32, so that is a cluster refusing to start
        # over a value the file appears to set correctly.
        secret=$(grep -m1 'OBJECTFS_CLUSTER_SECRET' /tmp/compose-resolved.yaml | sed 's/.*: *//')
        if [ "${#secret}" -lt 32 ]; then
          echo "::error::the resolved OBJECTFS_CLUSTER_SECRET is ${#secret} bytes, under" \
            "minSecretLen (32). An unquoted numeric-looking secret is coerced by YAML; quote it."
          exit 1
        fi

  # ---------------------------------------------------------------------------------------------
  # systemd-unit — configs/systemd/objectfs@.service, which operators are told to install.
  #
  # Two halves, and they check different things. `go test` checks that every objectfs command line
  # in the unit uses a subcommand the binary dispatches and flags it parses, with both sets scraped
  # from cmd/objectfs/main.go — that runs on every platform and needs no systemd.
  # `systemd-analyze verify` checks the other half, that the file is well-formed systemd, and it
  # needs a Linux runner with systemd installed, which is what this job is for.
  #
  # Neither half alone is enough, and the unit that shipped before v0.11.0 is the demonstration:
  # `ExecStart=/usr/local/bin/objectfs s3://%i /mnt/objectfs/%i` and
  # `ExecStop=/bin/fusermount3 -u /mnt/objectfs/%i` are both perfectly valid systemd — analyze
  # passes them — while the first makes the instance name and the bucket name one string and the
  # second calls a program that is absent on a minimal image, where its failure becomes a SIGKILL
  # through buffered writes after TimeoutStopSec.
  #
  # Verified as objectfs@example.service rather than as the template, because the unit is a template
  # and %i has no value until one is named — checking the uninstantiated form would check a file
  # whose ExecStart, ExecStop, and ReadWritePaths all still contain an unexpanded specifier.
  # ---------------------------------------------------------------------------------------------
  systemd-unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: The unit calls the binary the binary actually is
      run: go test ./internal/config/ -v -run 'TestSystemdUnit'

    - name: The unit is well-formed systemd
      run: |
        # ExecStart's binary does not exist on the runner and ExecStartPre's directories are not
        # creatable, so analyze reports those as warnings on stderr. Its exit code covers syntax
        # and directive validity, which is the half being checked here; a stub binary at the
        # unit's own path silences the executable-not-found line so a real error stands out.
        sudo install -d /usr/bin
        sudo tee /usr/bin/objectfs >/dev/null <<'STUB'
        #!/bin/sh
        exit 0
        STUB
        sudo chmod +x /usr/bin/objectfs

        sudo cp configs/systemd/objectfs@.service /etc/systemd/system/
        systemd-analyze verify /etc/systemd/system/objectfs@example.service

  # ---------------------------------------------------------------------------------------------
  # packaging — the deb and the rpm are built, installed, and removed, on a real dpkg.
  #
  # Its own job for the reason systemd-unit is: what it checks cannot be checked by `go test`. The
  # Go tests in internal/config/packaging_test.go read nfpm.yaml against the filesystem and *run*
  # the two maintainer scripts against a scratch root, which covers every coupling and every
  # idempotency claim — but not whether dpkg accepts the archive, and not whether it runs the
  # scriptlets in the states it actually runs them in.
  #
  # #207's diagnosis was that scripts/preremove.sh could never run, because a pre-removal hook is
  # invokable only by a package manager and there was no packaging in the tree. So the check that
  # matters is a package manager invoking it. `apt-get remove` with a mount absent is the passing
  # path; the failure path (a mount that will not unmount, where the script refuses) is covered by
  # the Go tests, because creating a busy FUSE mount on a runner needs /dev/fuse and a bucket.
  #
  # dpkg only. There is no rpm on ubuntu-latest and installing one gives a database with no
  # distribution behind it, so `rpm -i` would fail on unrelated dependency resolution rather than
  # on anything about this package. The rpm is still *built* here — nfpm's rpm writer is where a
  # malformed spec would surface — and `rpm -qp` under a container is the follow-on worth having.
  # ---------------------------------------------------------------------------------------------
  packaging:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: nfpm.yaml agrees with the scripts, the Makefile and the version constant
      run: go test ./internal/config/ -v -run 'TestPackag|TestPostinstall|TestPreremove|TestMakefile'

    - name: Build the deb and the rpm
      run: make package-linux

    - name: Install the deb, and let the postinstall scriptlet run
      run: |
        # apt-get update first: installing a local .deb still resolves Recommends (fuse3) against
        # the package lists, and a runner image's lists are as old as the image.
        sudo apt-get update
        sudo apt-get install -y ./dist/objectfs_*_amd64.deb

        # The scriptlet's own claims, checked against the filesystem rather than against its
        # output: the config it copies, the unit it installs, and a binary that runs.
        test -f /etc/objectfs/config.yaml
        test -f /usr/lib/systemd/system/objectfs@.service
        test -f /usr/share/objectfs/configs/example.yaml
        objectfs version

        # 0600, because it is the file an operator will paste a key into.
        [ "$(stat -c %a /etc/objectfs/config.yaml)" = "600" ]

    # The end of the chain #145 and #207 are two halves of, and the only step that runs all of it:
    # nfpm computes a destination, dpkg installs it, Lmod finds it by walking MODULEPATH, and the
    # modulefile derives a prefix from its own location and puts the binary on PATH. Each of those is
    # covered in isolation elsewhere — packaging_test.go on the dst, modulefiles_test.go on a staged
    # tree — and neither can see a disagreement between them. The failure they miss is a real one and
    # silent: an install that succeeds, a `module avail` that lists objectfs, and a `module load` that
    # exports nothing useful.
    #
    # Lmod only, and not by preference: on Ubuntu the `lmod` and `environment-modules` packages
    # Conflict, so no single runner can have both (see the modulefiles job below, which is a matrix
    # for that reason). Lmod is the right one to spend this job's single slot on — it is what the
    # large HPC sites run, and it is the stricter of the two about the name/version tree this dst
    # computes. What is under test here is the *installed path*, which both modulefiles share, so the
    # TCL file is not going untested: the modulefiles job runs it against a staged copy of the same
    # layout.
    - name: The installed modulefile loads under Lmod and reports the packaged version
      run: |
        sudo apt-get install -y lmod

        # From the constant, with release.yml's expression, because the version is in the *filename*.
        V=$(sed -n 's/^[[:space:]]*version = "\(.*\)"/\1/p' cmd/objectfs/main.go)
        test -n "$V"

        test -f "/usr/share/modulefiles/objectfs/$V.lua"
        test -f "/usr/share/modulefiles/objectfs/$V"

        # One module, one version — not two. Both files land in the same directory by design, and the
        # question this answers is what a module system makes of that. Lmod prefers the .lua and
        # collapses them; a listing with two entries, or with a version named "objectfs", means the
        # layout is wrong in a way `test -f` cannot see.
        avail=$(env -i MODULEPATH=/usr/share/modulefiles PATH=/usr/bin:/bin HOME="$HOME" \
          /usr/share/lmod/lmod/libexec/lmod bash avail 2>&1)
        echo "$avail"
        if [ "$(printf '%s\n' "$avail" | grep -c "objectfs/$V\b")" != "1" ]; then
          echo "::error::\`module avail\` does not list exactly one objectfs/$V. Shipping the Lmod" \
            "and TCL files into one directory is supposed to yield a single module; see nfpm.yaml."
          exit 1
        fi

        out=$(env -i MODULEPATH=/usr/share/modulefiles PATH=/usr/bin:/bin HOME="$HOME" \
          /usr/share/lmod/lmod/libexec/lmod bash load objectfs 2>&1)
        echo "$out"

        # The version, bound to the variable rather than found anywhere in the output. Lmod's own
        # bookkeeping (_LMFILES_, LOADEDMODULES) contains the version whatever the modulefile
        # computed, so a substring search here passes on a file that got it wrong — measured, in
        # modulefiles_test.go's comment at TestModulefilesLoadUnderRealModuleSystems.
        if ! printf '%s\n' "$out" | grep -qE "^OBJECTFS_VERSION=$V;?$"; then
          echo "::error::loading the installed module did not export OBJECTFS_VERSION=$V. The" \
            "modulefile reads its version out of its own install path, so this is nfpm.yaml's dst" \
            "and the modulefile disagreeing."
          exit 1
        fi

        # No PATH change, and that is the assertion rather than an omission.
        #
        # This is the one place where the packaged layout and a versioned HPC install differ, and the
        # difference is the point of the modulefile's systemBinDirs list. The deb installs the binary
        # to /usr/bin, which is already on every login PATH, so prepending it would be the hoisting
        # defect the file documents: Lmod replays the inverse of a prepend at unload, so hoisting
        # /usr/bin ahead of a site's own directories leaves it hoisted after `module unload`. A site
        # that installs to /sw/objectfs/<version> does get a prepend, which is what the staged-tree
        # test in the modulefiles job covers.
        #
        # So the check is that the load emitted no PATH assignment and the binary is reachable anyway.
        if printf '%s\n' "$out" | grep -qE '^PATH='; then
          echo "::error::loading the installed module changed PATH. The binary is in /usr/bin, which" \
            "is in the modulefile's systemBinDirs, so it must not be prepended — Lmod would leave it" \
            "hoisted after \`module unload\`. See the systemBinDirs comment in configs/modules/objectfs.lua."
          exit 1
        fi
        command -v objectfs

    - name: Reinstalling does not overwrite the operator's config
      run: |
        # The #137 case, on a real dpkg rather than against a scratch root: postinst runs again on
        # every reinstall and every upgrade, and this is the file whose replacement would be data
        # loss noticed only at the next mount.
        #
        # `dpkg -i` of the same version, not `dpkg-reconfigure`: reconfigure goes through debconf,
        # which this package has no config script for, and `dpkg --configure` on an
        # already-configured package is a no-op that never reaches postinst. Reinstalling the same
        # .deb does run it, with the "configure" action, which is the invocation being tested.
        #
        # It also runs prerm with "upgrade", since dpkg treats replacing a package as one — so this
        # step covers the other half of the #207 fix at the same time: the outgoing script must
        # recognise an upgrade and leave mounts and units alone. Nothing is mounted on the runner,
        # so what is observable here is that it does not fail; is_upgrade's mount-preserving branch
        # is covered against a scratch /proc/mounts by TestPreremoveLeavesMountsAloneOnUpgrade.
        echo "# edited by the operator" | sudo tee -a /etc/objectfs/config.yaml >/dev/null
        sudo cp /etc/objectfs/config.yaml /tmp/expected.yaml
        # 0750, an operator-tightened directory mode that must also survive. This is the other half
        # of #137: the previous postinstall.sh ran `chmod 755` unconditionally, so every upgrade
        # silently widened it back. 0750 rather than 0640 because a directory without its execute
        # bit cannot be traversed at all, which would be testing a mode no operator would set.
        sudo chmod 750 /etc/objectfs

        sudo dpkg -i ./dist/objectfs_*_amd64.deb

        sudo diff /tmp/expected.yaml /etc/objectfs/config.yaml
        [ "$(stat -c %a /etc/objectfs)" = "750" ]
        sudo chmod 755 /etc/objectfs

    - name: Remove the package, and assert nothing is left enabled or mounted
      run: |
        # This step is #207. Before the packaging existed, nothing in the repository could reach
        # scripts/preremove.sh at all.
        sudo apt-get remove -y objectfs

        # No objectfs@ unit remains enabled.
        if systemctl list-unit-files 'objectfs@*.service' --state=enabled --no-legend | grep .; then
          echo "::error::an objectfs@ unit is still enabled after removal"
          exit 1
        fi

        # No objectfs mount remains. Both spellings, because the mount reports fuse.s3 (Subtype
        # "s3") rather than fuse.objectfs — which is the assumption the old preremove.sh was
        # written against, and the reason its unmount loop had never matched a real mount.
        if grep -E 'fuse\.(objectfs|s3)' /proc/mounts; then
          echo "::error::an objectfs mount survived removal"
          exit 1
        fi

        # The configuration is preserved, and the scriptlet says so on the way out — an operator
        # retrying a removal should not have to wonder whether their config went with it.
        test -f /etc/objectfs/config.yaml

        # The package's own files are gone, which is the other half of a removal working. Every
        # path here is one nfpm.yaml ships, so dpkg owns it and `remove` — not just `purge` — takes
        # it.
        test ! -f /usr/bin/objectfs
        test ! -f /usr/lib/systemd/system/objectfs@.service
        test ! -f /usr/share/objectfs/configs/example.yaml

        # The modulefiles too, and this one is worth asserting rather than assuming: a leftover
        # modulefile is worse than a leftover data file, because `module load objectfs` would still
        # appear to work and would then refuse with "no objectfs binary found" — the fail-closed path
        # doing its job, in a situation that should not exist. Their dst is computed from the version,
        # so it is also the entry most likely to end up unowned by dpkg.
        if find /usr/share/modulefiles/objectfs -type f 2>/dev/null | grep .; then
          echo "::error::a modulefile survived removal, so \`module avail\` still lists objectfs" \
            "after the package is gone"
          exit 1
        fi

    - name: There is no purge phase, because the package owns nothing under /etc
      run: |
        # This step used to run `apt-get purge -y objectfs` and assert the config survived it. That
        # failed, and the failure was informative rather than a bug in the packaging:
        #
        #   E: Unable to locate package objectfs
        #
        # dpkg keeps a removed package in the `rc` state — removed, config-files remain — only when
        # it has **conffiles**, and a conffile is precisely what nfpm.yaml declines to create by
        # shipping nothing under /etc (a packaged file there prompts on upgrade, which hangs an
        # unattended `apt upgrade`). With no conffiles there is no residual state, so `remove` is
        # already complete: the package leaves dpkg's database entirely, apt no longer knows the name,
        # and `purge` has nothing to act on. The previous step's assertions were the whole removal.
        #
        # So this asserts that, rather than performing a purge that cannot exist. `dpkg-query` exits
        # 1 for a package it has no record of, which is the expected outcome here — hence the `if`
        # rather than a bare call under `set -e`.
        if state=$(dpkg-query -W -f='${Status}' objectfs 2>/dev/null); then
          echo "dpkg still has a record of objectfs: $state"

          # `deinstall ok config-files` is the rc state. Reaching it would mean the package started
          # shipping a conffile, which is a decision with an upgrade-prompt consequence and should
          # not arrive silently.
          case "$state" in
          *config-files*)
            echo "::error::objectfs is in dpkg's rc state, so it now ships a conffile. That means" \
              "an upgrade will prompt the operator to merge it, which hangs an unattended apt run —" \
              "see the /etc reasoning in nfpm.yaml. If this is intended, it needs a postremove" \
              "scriptlet and this step needs to become a real purge test."
            exit 1
            ;;
          esac
        else
          echo "dpkg has no record of objectfs, which is the expected end state."
        fi

        # And the config file survives, which is the cost of that design stated as an assertion.
        # It is created by scripts/postinstall.sh rather than shipped, so dpkg never owned it and
        # nothing in a removal path deletes it. Only a postremove scriptlet keyed on "purge" could,
        # and there is none: deleting an operator's configuration is not a thing to add without
        # deciding it on purpose.
        #
        # The consequence to know: removing objectfs and reinstalling it keeps the old config,
        # because postinstall.sh copies only when the file is absent.
        test -f /etc/objectfs/config.yaml

  # ---------------------------------------------------------------------------------------------
  # modulefiles — configs/modules/ under real Lmod and real TCL Modules.
  #
  # Its own job because it needs two interpreters no other job wants, and because without it the
  # tests that matter most here do not run at all. `TestModulefilesLoadUnderRealModuleSystems` and
  # `TestModulefilesRefuseToLoadWithoutABinaryUnderRealModuleSystems` call `t.Skipf` when neither
  # `lmod` nor `modulecmd.tcl` is on the box — correct on a developer laptop, and on a bare runner
  # it means `go test` exits 0 having checked nothing an HPC site cares about.
  #
  # That gap is not hypothetical. The structural checks in modulefiles_test.go read the files; only
  # the interpreter can tell you that Lmod resolves a two-level `name/version` tree and makes the
  # *version* the name if you add a third level, that TCL's `prepend-path` skips a directory already
  # on PATH while Lmod's hoists it to the front and leaves it there after `module unload`, or that a
  # refusal emits zero environment changes rather than half-applying. Every one of those was a real
  # defect in this feature's first draft, and every one is invisible without the real thing.
  #
  # So the skip is an error here, on the same reasoning as the labels job below: a gate that reports
  # success for work it did not do is worse than no gate.
  #
  # A MATRIX, one interpreter per leg, and that is forced rather than stylistic: on Ubuntu the `lmod`
  # and `environment-modules` packages **Conflict**, so they cannot both be installed on one runner.
  #
  #   environment-modules : Conflicts: lmod but 8.6.19-1 is to be installed
  #   lmod : Conflicts: environment-modules but 5.4.0-1 is to be installed
  #   E: Unable to correct problems, you have held broken packages.
  #
  # Measured, by trying it — the first version of this job installed both in one step and failed with
  # exit 100 before running a single test. They conflict because both ship /usr/bin/modulecmd and both
  # want to own the shell init snippets in /etc/profile.d. Which is itself the argument for testing
  # both: a site runs one or the other, never both, and the two disagree on PATH semantics.
  # ---------------------------------------------------------------------------------------------
  modulefiles:
    # Named explicitly, because the default name interpolates every matrix value and these legs carry
    # an absolute interpreter path — the checks appeared as `modulefiles (lmod, lmod,
    # /usr/share/lmod/lmod/libexec/lmod)`. Both legs are required contexts in main's branch
    # protection, and a required context is matched by exact string: the day a distro moves
    # modulecmd.tcl, the renamed check would never report and every PR would block on a context that
    # can no longer arrive. The system is the part of the identity that is stable.
    name: modulefiles (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs run to completion. A failure under Lmod says nothing about TCL and the reviewer
      # wants both answers from one push.
      fail-fast: false
      matrix:
        include:
        - system: lmod
          package: lmod
          # interpreter must be one of the candidate paths in modulefiles_test.go.
          interpreter: /usr/share/lmod/lmod/libexec/lmod
        - system: tcl-modules
          package: environment-modules
          interpreter: /usr/lib/x86_64-linux-gnu/modulecmd.tcl
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: Install ${{ matrix.package }}
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.package }}

    # The interpreter has to be where modulefiles_test.go looks, and the test's response to its
    # absence is a skip. Checking it here instead means a packaging change reports as "the path
    # moved, here is where it went" rather than as a green run — and it reports before the test,
    # rather than as a grep for a string in its output.
    - name: The interpreter is where the test looks for it
      run: |
        if [ ! -x "${{ matrix.interpreter }}" ]; then
          echo "::error::${{ matrix.interpreter }} is not executable, so the test that needs it" \
            "would skip and this job would pass having checked only the structural half."
          echo "What ${{ matrix.package }} actually installed:"
          dpkg -L ${{ matrix.package }} | grep -E 'lmod$|modulecmd' || true
          echo "Add the path to the candidate list in internal/config/modulefiles_test.go."
          exit 1
        fi

    - name: The modulefiles load, and refuse, under ${{ matrix.system }}
      run: |
        set -o pipefail
        go test ./internal/config/ -v -run 'TestModulefiles' 2>&1 | tee modulefiles.log

        # Backstop to the check above, and not redundant with it: both real-interpreter tests have a
        # second skip condition the filesystem check cannot see — the refusal test skips when
        # /usr/bin/objectfs exists, since the modulefile's fallback search then finds a binary and
        # there is no absent-binary case left to run. This job installs no objectfs, which is why it
        # is its own job and not a step in `packaging`. If that ever changes, this catches it.
        #
        # THIS leg's subtests only. The other system's subtests skip here by design and correctly —
        # its interpreter conflicts with this one's package and is genuinely not installed — so
        # asserting on both would fail every leg. Each system is covered by its own matrix leg, and
        # `--- SKIP` for the pair is the sum of the two legs, not of one.
        for t in Load Refuse; do
          if grep -qE "^ *--- SKIP: TestModulefiles${t}[A-Za-z]*/${{ matrix.system }} " modulefiles.log; then
            echo "::error::TestModulefiles${t}.../${{ matrix.system }} skipped instead of running," \
              "so this leg checked only the structural half. That is a CI configuration failure, not" \
              "a pass. The skip message in the log says which condition fired."
            exit 1
          fi
        done

  # ---------------------------------------------------------------------------------------------
  # labels — .github/labels.yml against the labels the repository actually has, both directions.
  #
  # Its own job because it is the one gate here that needs the GitHub API, and because a failure
  # names an action outside the codebase: add a label to the file, or delete one from the
  # repository. Nothing in a diff can tell a reviewer that.
  #
  # Not keyed on labels.yml changing, which is what #190 proposed. Every drift this repository has
  # had originated on GitHub — two labels created in the web UI, one invented by `gh issue create
  # --label`, six GitHub defaults never deleted — and none of those events touches the file, so a
  # `paths:` filter would have fired on exactly zero of the nine. Verified with `git log -S` for
  # the exact `- name:` form of each.
  # ---------------------------------------------------------------------------------------------
  labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

      # The API half of the gate skips when gh cannot reach the API, which is right for a laptop and
      # wrong here: a skipped gate reports success. So the output is checked for the skip, because
      # `go test` exits 0 either way and this job exists to be the one place that cannot happen.
    - name: Label taxonomy matches the repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -o pipefail
        go test ./internal/config/ -v \
          -run 'TestLabelsYAMLIsWellFormed|TestLabelsYAMLMatchesTheRepository|TestDependabotLabelsAreDefined|TestSyncLabelsScriptCanParseTheFile' \
          2>&1 | tee labels.log

        if grep -q 'SKIP.*TestLabelsYAMLMatchesTheRepository' labels.log; then
          echo "::error::the label comparison skipped instead of running, so this job checked" \
            "only the offline half. gh could not reach the API — that is a CI configuration" \
            "failure, not a pass."
          exit 1
        fi

  # ---------------------------------------------------------------------------------------------
  # install-script — scripts/install.sh in the distributions it claims to support.
  #
  # This is part (b) of #138, and the job exists because the two defects it caught cannot be caught
  # any other way. `shellcheck` passes on this script and always did; the local run on macOS
  # succeeded; and the script still failed on two of the three images #138 names, both times with an
  # error naming the wrong cause:
  #
  #   - ubuntu:24.04 has neither curl nor wget, and the script reported "could not reach the GitHub
  #     API to find the latest release. Pass --version to skip this step" — advice that cannot work.
  #   - opensuse/leap:15.6 has neither tar nor gzip, and the script downloaded the archive,
  #     verified its checksum, and then reported "a tar that cannot read the archive rather than a
  #     corrupt file". Installing only tar moved the same misattribution one layer down, because
  #     `tar -xzf` shells out to gzip and reports the child's failure as its own.
  #
  # A wrong cause is the expensive failure direction: it sends the reader to check the release, the
  # network and the file, and never mentions the missing package. So both success and refusal are
  # asserted below — a job that only checked the refusal would pass against a script that can no
  # longer install anything.
  #
  # Two things this deliberately does not do. It does not use LocalStack, which #138 specifies:
  # nothing here touches S3, since the script downloads a GitHub release asset and runs `objectfs
  # --version`, and adding a mock S3 endpoint to a job that makes no S3 request is machinery with
  # nothing behind it. And it does not test the PR's own code — the installer fetches a *published
  # release*, so what runs here is the last release's binary. That is the right subject: the thing
  # under test is the install path, and pointing it at an artifact built in this workflow would test
  # a URL no user will ever fetch.
  #
  # The images are #138's three, and the versions are pinned rather than floating. An image that
  # gains curl in a later build would silently stop exercising the wget path, which is the branch
  # that resolves the latest release through the API on a machine without curl.
  # ---------------------------------------------------------------------------------------------
  install-script:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        # ubuntu:24.04 ships neither downloader, so this row is the wget path *and* the refusal.
        - image: ubuntu:24.04
          missing: curl or wget
          install: apt-get update -qq && apt-get install -y -qq wget
        # rockylinux:9 has curl, sha256sum, tar and gzip already, so it is the row where the script
        # works with nothing installed — the only row that would catch a preflight check that has
        # become wrong about what it needs.
        - image: rockylinux:9
          missing: ''
          install: ''
        - image: opensuse/leap:15.6
          missing: tar
          install: zypper -q -n install tar gzip
    steps:
    - uses: actions/checkout@v7

    # Not `container:` on the job, because the checkout has to happen on the runner and the script
    # has to run inside each image — a job-level container would put the checkout inside it too and
    # need git installed in all three.
    - name: The script refuses, or installs, and says which
      env:
        IMAGE: ${{ matrix.image }}
        MISSING: ${{ matrix.missing }}
        INSTALL: ${{ matrix.install }}
      run: |
        set -euo pipefail

        # A bare image that is missing a requirement must refuse *before downloading*, and must name
        # the thing that is missing. This is the assertion the two defects above would have failed.
        if [ -n "$MISSING" ]; then
          out=$(docker run --rm -v "$PWD/scripts/install.sh":/install.sh:ro "$IMAGE" \
            bash -c '/install.sh --prefix /opt/ofs 2>&1; echo "EXIT=$?"' || true)
          echo "$out"

          if ! grep -q "EXIT=1" <<<"$out"; then
            echo "::error::$IMAGE is missing $MISSING and install.sh did not exit 1. A script that" \
              "proceeds without $MISSING fails later, blaming something else."
            exit 1
          fi

          if ! grep -q "$MISSING" <<<"$out"; then
            echo "::error::install.sh refused on $IMAGE without naming '$MISSING'. An error that" \
              "does not name the missing tool sends the reader to check the release, the network" \
              "and the file — none of which is the problem."
            exit 1
          fi

          # And nothing may be left behind by a refusal.
          if docker run --rm -v "$PWD/scripts/install.sh":/install.sh:ro "$IMAGE" \
            bash -c '/install.sh --prefix /opt/ofs >/dev/null 2>&1 || true; test -e /opt/ofs/bin/objectfs'; then
            echo "::error::install.sh refused on $IMAGE but left a binary at /opt/ofs/bin/objectfs."
            exit 1
          fi
        fi

        # Then it has to actually work. Installing the missing package first where there is one;
        # rockylinux:9 installs nothing, which is what makes it the row that catches a preflight
        # demanding something the script does not need.
        prep=""
        [ -n "$INSTALL" ] && prep="$INSTALL >/dev/null 2>&1;"

        # `|| true` for the same reason the refusal branch above has it, and its absence here cost a
        # diagnosis. When the install failed, `--version` exited 127, `set -e` killed the step at the
        # assignment, and `echo "$out"` never ran — so the log held bash's "No such file or directory"
        # and not one of the three messages below, all of which were unreachable on exactly the runs
        # they were written for. A job whose assertions can only be read when they pass is reporting
        # the same non-answer this job exists to reject.
        out=$(docker run --rm -v "$PWD/scripts/install.sh":/install.sh:ro "$IMAGE" \
          bash -c "$prep /install.sh --prefix /opt/ofs 2>&1; echo \"EXIT=\$?\"; /opt/ofs/bin/objectfs --version" || true)
        echo "$out"

        grep -q "EXIT=0" <<<"$out" || {
          echo "::error::install.sh did not succeed on $IMAGE."; exit 1; }

        grep -q "checksum verified" <<<"$out" || {
          echo "::error::install.sh installed on $IMAGE without reporting a verified checksum." \
            "The checksum is not optional and there is no flag to skip it, so its absence from the" \
            "output means the verification step was bypassed."
          exit 1; }

        grep -qE "^objectfs version [0-9]+\.[0-9]+\.[0-9]+" <<<"$out" || {
          echo "::error::the installed binary on $IMAGE did not print a version. An installer that" \
            "succeeds and leaves a binary that cannot run has produced the same outcome as one" \
            "that failed, minus the explanation."
          exit 1; }

    # Twice, same result. #138 asks for idempotency and the interesting half is not "it does not
    # crash" — it is that the second run leaves the identical binary, which is what makes re-running
    # the documented one-liner safe on a machine that already has objectfs.
    - name: Running it twice leaves the same binary
      env:
        IMAGE: ${{ matrix.image }}
        INSTALL: ${{ matrix.install }}
      run: |
        set -euo pipefail

        prep=""
        [ -n "$INSTALL" ] && prep="$INSTALL >/dev/null 2>&1;"

        out=$(docker run --rm -v "$PWD/scripts/install.sh":/install.sh:ro "$IMAGE" \
          bash -c "$prep \
            /install.sh --prefix /opt/ofs >/dev/null 2>&1; a=\$(sha256sum /opt/ofs/bin/objectfs | cut -d' ' -f1); \
            /install.sh --prefix /opt/ofs >/dev/null 2>&1; b=\$(sha256sum /opt/ofs/bin/objectfs | cut -d' ' -f1); \
            echo \"a=\$a b=\$b\"; [ \"\$a\" = \"\$b\" ] && echo SAME || echo DIFFERENT")
        echo "$out"

        grep -q SAME <<<"$out" || {
          echo "::error::two runs of install.sh on $IMAGE left different binaries."; exit 1; }

  # ---------------------------------------------------------------------------------------------
  # repo-install — the apt and yum repositories, built and installed from, on every PR.
  #
  # This is part (c) of #138 and the job that makes the feature testable at all. The repositories are
  # generated by pages.yml from *release assets*, so nothing about them is checkable from the tree: the
  # first end-to-end proof would otherwise arrive with v0.14.0, on the deploy, in front of users. So this
  # job builds the same repositories from `make package-linux`, signs them with a throwaway key generated
  # in the runner, serves them over localhost, and runs the setup scripts on the images they target.
  #
  # It found two defects that nothing else could, and both are the "wrong cause" shape #138's part (b)
  # was already about:
  #
  #   - **nfpm produced unsigned rpms.** `repo_gpgcheck=1` passed and `gpgcheck=1` failed, so dnf
  #     downloaded the package and stopped with "Package objectfs-0.13.0-1.x86_64.rpm is not signed /
  #     Error: GPG check FAILED". Signing the *repository* is not signing the *packages*: apt's InRelease
  #     covers the Packages indexes, which carry each .deb's checksum, so one signature at the top
  #     transitively covers them; rpm has no such chain and each package stands alone.
  #
  #   - **`nfpm.yaml`'s key_id had to be a 16-hex-digit long key ID.** A fingerprint fails with a
  #     strconv range error and an 8-character short ID fails with "no valid signing keys" — an error
  #     that names no key at all and reads like a broken key file.
  #
  # Neither is visible to shellcheck, to a YAML lint, or to a local run on macOS, which is the same
  # lesson the install-script job above records. What is different here is that the *subject* is a
  # workflow: the repository-building shell lives in pages.yml, so this job extracts and runs it rather
  # than keeping a second copy to drift.
  #
  # A throwaway key, never the production one. GPG_SIGNING_KEY is not available to pull-request runs from
  # forks and should not be: what is under test is whether the scripts and the metadata agree, and a key
  # generated here proves that better than the real key would, because a *fresh* key cannot be trusted
  # by accident through some already-imported copy.
  # ---------------------------------------------------------------------------------------------
  repo-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ env.GO_VERSION_FILE }}
        cache: true

    - name: The setup scripts, pages.yml and nfpm.yaml agree with each other
      run: go test ./internal/config/ -v -run 'TestRepoSetup|TestPagesWorkflowBuildsThePackageRepositories|TestRPMPackagesAreSigned'

    - name: Build the packages, signed with a throwaway key
      run: |
        set -euo pipefail

        export GNUPGHOME="$RUNNER_TEMP/gnupg"
        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"

        # No passphrase on the CI key. The production key has one and release.yml handles it through
        # gpg.conf; adding one here would test gpg's passphrase plumbing rather than the repositories.
        gpg --batch --quiet --passphrase '' --pinentry-mode loopback \
          --quick-generate-key 'ObjectFS CI <ci@example.invalid>' rsa4096 sign never

        FPR="$(gpg --batch --with-colons --list-secret-keys \
          | awk -F: '$1 == "fpr" { print $10; exit }')"
        gpg --batch --armor --export-secret-keys "$FPR" > "$GNUPGHOME/secret.asc"
        gpg --batch --armor --export "$FPR" > "$RUNNER_TEMP/objectfs.asc"

        # Exported into *this* shell, and separately written to $GITHUB_ENV for the steps after it.
        # Both, because they do different things, and confusing the two is what failed here first: a
        # $GITHUB_ENV write takes effect in *subsequent* steps only, so `make package-linux` three lines
        # below ran with neither variable set. nfpm does not treat an unset key_file as an error — it
        # skips signing and writes an unsigned package — so the build succeeded, printed four "created
        # package" lines, and produced exactly the unsigned rpm this job exists to catch.
        #
        # It was caught, which is why this is a comment rather than a defect:
        # `dist/objectfs-0.13.0-1.aarch64.rpm: digests OK`. Note which half of the check below did the
        # work — the exit status was 0, as it is for every unsigned package.
        export OBJECTFS_SIGNING_KEY_FILE="$GNUPGHOME/secret.asc"
        # 16 hex digits, not the fingerprint. See nfpm.yaml.
        export OBJECTFS_SIGNING_KEY_ID="${FPR: -16}"

        {
          echo "GNUPGHOME=$GNUPGHOME"
          echo "CI_KEY_FPR=$FPR"
          echo "OBJECTFS_SIGNING_KEY_FILE=$OBJECTFS_SIGNING_KEY_FILE"
          echo "OBJECTFS_SIGNING_KEY_ID=$OBJECTFS_SIGNING_KEY_ID"
        } >> "$GITHUB_ENV"

        make package-linux

        # Signed, asserted on the *text* rather than the status. An unsigned rpm prints "digests OK" and
        # exits 0; only a signed one prints "digests signatures OK". Measured, not assumed — a status
        # check here would pass on every unsigned package, which is precisely how the unsigned rpm got
        # as far as a container in the first place.
        sudo apt-get update -qq
        sudo apt-get install -y -qq rpm
        rpm --dbpath "$RUNNER_TEMP/rpmdb" --initdb
        rpm --dbpath "$RUNNER_TEMP/rpmdb" --import "$RUNNER_TEMP/objectfs.asc"
        for pkg in dist/*.rpm; do
          out="$(rpm --dbpath "$RUNNER_TEMP/rpmdb" -K "$pkg")"
          case "$out" in
            *"signatures OK"*) echo "ok: $out" ;;
            *) echo "::error::$pkg carries no signature: $out"; exit 1 ;;
          esac
        done

    # The repositories, built by the same shell that pages.yml runs.
    #
    # Extracted from the workflow rather than reimplemented, because a second copy of this logic would
    # drift and the drift would be invisible: this job would keep passing against its own copy while the
    # deployed site served something else. The only substitution is the `gh release download` loop, which
    # needs published releases with packages attached — and there are none until v0.14.0, which is the
    # whole reason this job cannot wait for one.
    - name: Build the apt and yum repositories, using pages.yml's own steps
      run: |
        set -euo pipefail

        sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c

        mkdir -p _site packages
        cp dist/*.deb dist/*.rpm packages/

        # The step's shell, lifted verbatim from the workflow. Extracted with python rather than
        # hand-copied so that an edit to pages.yml is picked up here automatically; the substitution
        # below replaces exactly the gh-release loop and nothing else.
        python3 - <<'PY'
        import re
        src = open('.github/workflows/pages.yml').read().split('\n')
        start = next(i for i, l in enumerate(src) if 'Build the apt and yum repositories' in l)
        run = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |') + 1
        body = []
        for l in src[run:]:
            if l.strip() == '' or l.startswith(' ' * 8):
                body.append(l[8:] if l.startswith(' ' * 8) else '')
            else:
                break
        s = '\n'.join(body)
        # Only the release download is stubbed: the packages are already in ./packages.
        i = s.index('mkdir -p packages')
        j = s.index('debs="$(find packages')
        s = s[:i] + 'kept=1\ndropped=" v0.0.0-harness"\n' + s[j:]
        s = s.replace('sudo apt-get', 'true # already installed: apt-get')

        # The step's `env:` block, carried across with the shell rather than left behind. This is a
        # gap the first version of this extractor had and the extraction hid: it took the `run:`
        # body and none of the YAML around it, so REPO_KEEP -- set to a plain literal in `env:` and
        # read by the step's summary -- was unbound, and `set -u` killed the script on its last line
        # after both repositories had built and both signatures had verified.
        #
        # Only plain literals: the secrets.* and github.token entries are supplied by this job
        # explicitly below, with values a CI harness can have. Substituting a template expression
        # here would write its literal text into a shell variable, which is worse than leaving it
        # unset because then nothing would fail.
        #
        # The marker is built from its two halves rather than written out, and so is every mention of
        # it in the comments here. Actions interpolates expressions inside a `run:` block before any
        # shell sees it, so a literal one in a comment is still evaluated -- and `secrets.*` is not a
        # valid expression, which fails the whole workflow file at parse time. No job starts, so the
        # run reports "likely failed because of a workflow file issue" and nothing else.
        marker = '$' + '{' + '{'
        env = []
        for l in src[start:run]:
            m = re.match(r"^ {8}([A-Z_][A-Z0-9_]*): +(.+)$", l)
            if m and marker not in m.group(2):
                env.append(f'export {m.group(1)}={m.group(2)}')
        # A match count of zero means the indent or the quoting moved and this loop found nothing,
        # which is the same outcome as not having it and is invisible here — the failure would land
        # 160 lines later as an unbound variable naming the symptom.
        if not env:
            raise SystemExit('carried no literal env vars out of pages.yml: the `env:` block moved '
                             'or changed shape, and the extracted step reads REPO_KEEP under `set -u`')
        open('repo-step.sh', 'w').write(
            'set -euo pipefail\n' + '\n'.join(env) + '\n' + s + '\n')
        print(f'extracted {len(body)} lines and {len(env)} literal env var(s) from pages.yml')
        PY

        # The signing key the step expects, in the form it expects: the armored secret key in an
        # environment variable. Same shape as the GPG_SIGNING_KEY secret.
        GPG_SIGNING_KEY="$(cat "$GNUPGHOME/secret.asc")"
        export GPG_SIGNING_KEY
        export GPG_PASSPHRASE=""

        # The step writes to GITHUB_STEP_SUMMARY, which exists; and it re-derives GNUPGHOME itself.
        unset GNUPGHOME

        # Every env var the extracted script still *reads* must now be set, one way or the other: the
        # plain literals by the extractor above, the templated ones by this shell. Checked rather than
        # assumed, because a name added to pages.yml's `env:` and not mirrored here is unbound under
        # `set -u` — which is how this job failed the first time, on the script's last line, after
        # both repositories had built and both signatures had verified.
        #
        # "Still reads" is the qualifier that matters. GH_TOKEN is in that `env:` block and is only
        # used by the `gh release download` loop the substitution removes, so requiring it would fail
        # this job over a variable nothing in the harness can reach.
        # `printenv` rather than a shell-variable test, and that is the stricter of the two: the script
        # runs as a subprocess, so only *exported* variables reach it. A plain assignment in this shell
        # would satisfy `[ -n "${!v+x}" ]` and still leave the child unbound.
        while read -r v; do
          grep -q '\$'"{\?$v" repo-step.sh || continue
          printenv "$v" > /dev/null || grep -q "^export $v=" repo-step.sh \
            || { echo "::error::repo-step.sh reads $v and nothing exports it"; exit 1; }
        done < <(sed -n "/Build the apt and yum repositories/,/run: |/p" .github/workflows/pages.yml \
          | sed -n 's/^ \{8\}\([A-Z_][A-Z0-9_]*\):.*/\1/p')

        bash repo-step.sh

        # What the step claims to have produced, checked here so a change that stops producing one of
        # these fails in this job rather than on the deployed site.
        for f in _site/objectfs.asc \
                 _site/apt/dists/stable/InRelease \
                 _site/apt/dists/stable/Release.gpg \
                 _site/apt/dists/stable/main/binary-amd64/Packages \
                 _site/apt/dists/stable/main/binary-arm64/Packages \
                 _site/yum/repodata/repomd.xml \
                 _site/yum/repodata/repomd.xml.asc; do
          test -s "$f" || { echo "::error::pages.yml's repository step produced no $f"; exit 1; }
        done

        # reprepro's db/ and conf/ must not be in the site, and neither must anything else unexpected.
        # This is a size check as much as a hygiene one: the Pages limit is what bounds this feature.
        du -sh _site/apt _site/yum

    # Debian and Ubuntu. `apt-get install objectfs` from the repository, with the key scoped by
    # Signed-By, plus the two mutations that show the signature is actually being checked.
    - name: apt install objectfs, from the repository
      run: |
        set -euo pipefail

        cat > /tmp/apt-test.sh <<'SH'
        set -uo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq >/dev/null 2>&1
        apt-get install -y -qq gnupg python3 >/dev/null 2>&1

        cd /site && python3 -m http.server 8099 >/dev/null 2>&1 &
        sleep 2
        export OBJECTFS_REPO_URL="http://127.0.0.1:8099/apt"
        export OBJECTFS_KEY_URL="http://127.0.0.1:8099/objectfs.asc"

        # Before anything else: the refusal. A bare image has no downloader, and the script must name
        # that rather than blame the repository.
        out="$(bash /w/scripts/setup-repo-debian.sh 2>&1)" && { echo "FAIL: succeeded with no downloader"; exit 1; }
        grep -q "curl or wget" <<<"$out" || { echo "FAIL: refusal did not name curl or wget"; echo "$out"; exit 1; }
        echo "ok: refused without a downloader, naming it"

        apt-get install -y -qq wget >/dev/null 2>&1
        bash /w/scripts/setup-repo-debian.sh || { echo "FAIL: setup failed"; exit 1; }

        # Only our repository in the lists, so an unrelated "Hit:" line cannot satisfy a grep below.
        mv /etc/apt/sources.list.d/ubuntu.sources /root/ 2>/dev/null || true
        fresh() { rm -rf /var/lib/apt/lists/*; apt-get update 2>&1; }

        out="$(fresh)"
        grep -qiE "not signed|couldn't be verified|NO_PUBKEY" <<<"$out" \
          && { echo "FAIL: refused with the correct key"; echo "$out"; exit 1; }
        echo "ok: apt accepted the signed index"

        apt-get install -y objectfs >/dev/null 2>&1 || { echo "FAIL: install failed"; exit 1; }
        objectfs --version | grep -qE "^objectfs version [0-9]" || { echo "FAIL: installed binary does not run"; exit 1; }
        echo "ok: installed and runs — $(objectfs --version)"

        # Idempotence: a second run must report leaving both files alone, not rewrite them.
        out="$(bash /w/scripts/setup-repo-debian.sh 2>&1)"
        grep -q "already this key" <<<"$out" || { echo "FAIL: rewrote the keyring on a re-run"; exit 1; }
        grep -q "already correct" <<<"$out" || { echo "FAIL: rewrote the source on a re-run"; exit 1; }
        echo "ok: idempotent"

        # The mutation. A different key in the keyring must make apt refuse the index — this is what
        # distinguishes "apt verified our signature" from "apt did not look".
        export GNUPGHOME=/tmp/wrong; mkdir -p $GNUPGHOME; chmod 700 $GNUPGHOME
        gpg --batch --quiet --passphrase '' --pinentry-mode loopback \
          --quick-generate-key 'Wrong <w@example.invalid>' rsa2048 sign never 2>/dev/null
        gpg --batch --armor --export > /tmp/wrong.asc
        unset GNUPGHOME
        gpg --batch --yes --dearmor --output /usr/share/keyrings/objectfs-archive-keyring.gpg /tmp/wrong.asc

        out="$(fresh)"
        grep -qiE "not signed|couldn't be verified|NO_PUBKEY" <<<"$out" \
          || { echo "FAIL: apt accepted an index signed by a key it does not have"; echo "$out"; exit 1; }
        echo "ok: apt refused an index signed by another key"

        # And the package must then be unreachable. Purged and the archive cache cleared first, because
        # neither is optional for this to mean anything: `--reinstall` against an installed package
        # succeeds from /var/cache/apt/archives without consulting the repository at all, which is how
        # the first version of this assertion reported a pass for a check that never contacted the
        # server. What is under test is whether an unverified index can still yield a package.
        apt-get purge -y objectfs >/dev/null 2>&1
        apt-get clean
        out="$(apt-get install -y objectfs 2>&1)" \
          && { echo "FAIL: installed from an index apt could not verify"; echo "$out"; exit 1; }
        grep -qi "unable to locate package" <<<"$out" \
          || { echo "FAIL: install failed, but not because the package was unreachable"; echo "$out"; exit 1; }
        echo "ok: the package is unreachable with the wrong key"
        SH

        docker run --rm -v "$PWD:/w:ro" -v "$PWD/_site:/site:ro" -v /tmp/apt-test.sh:/t.sh:ro \
          ubuntu:24.04 bash /t.sh

    # RHEL family and SUSE. Both gpg checks on, and the SUSE row is why repo_dir() exists: zypper reads
    # /etc/zypp/repos.d and does not read /etc/yum.repos.d, so a yum-only script configures nothing
    # there and reports success.
    - name: dnf and zypper install objectfs, from the repository
      run: |
        set -euo pipefail

        cat > /tmp/rpm-test.sh <<'SH'
        set -uo pipefail
        PKG="$1"

        if [ "$PKG" = zypper ]; then
          zypper -q -n install python3 curl gpg2 >/dev/null 2>&1
        else
          $PKG install -y -q python3 curl gnupg2 >/dev/null 2>&1
        fi

        cd /site && python3 -m http.server 8099 >/dev/null 2>&1 &
        sleep 2
        export OBJECTFS_REPO_URL="http://127.0.0.1:8099/yum"
        export OBJECTFS_KEY_URL="http://127.0.0.1:8099/objectfs.asc"

        out="$(bash /w/scripts/setup-repo-rhel.sh 2>&1)" || { echo "FAIL: setup failed"; echo "$out"; exit 1; }
        echo "$out" | grep -E "repo file|imported|wrote"

        # The right directory for this machine's package manager, and it must be the one that gets used.
        if [ "$PKG" = zypper ]; then
          test -f /etc/zypp/repos.d/objectfs.repo \
            || { echo "FAIL: no repo file in /etc/zypp/repos.d, which is the only directory zypper reads"; exit 1; }
        else
          test -f /etc/yum.repos.d/objectfs.repo || { echo "FAIL: no repo file in /etc/yum.repos.d"; exit 1; }
        fi

        # Both checks on, asserted from the file the script actually wrote. `repo` is resolved above
        # rather than globbed across both directories: a glob that matches nothing expands to a literal
        # path, grep reports "No such file", and with 2>/dev/null that is indistinguishable from a
        # missing setting — so the assertion would have been satisfied by the file being absent.
        if [ "$PKG" = zypper ]; then repo=/etc/zypp/repos.d/objectfs.repo; else repo=/etc/yum.repos.d/objectfs.repo; fi
        grep -qx 'gpgcheck=1' "$repo" || { echo "FAIL: gpgcheck=1 is not in $repo"; exit 1; }
        grep -qx 'repo_gpgcheck=1' "$repo" || { echo "FAIL: repo_gpgcheck=1 is not in $repo"; exit 1; }

        if [ "$PKG" = zypper ]; then
          zypper -n refresh objectfs >/dev/null 2>&1 || { echo "FAIL: refresh failed"; exit 1; }
          zypper -n install objectfs >/dev/null 2>&1 || { echo "FAIL: install failed"; exit 1; }
        else
          $PKG install -y objectfs >/dev/null 2>&1 || { echo "FAIL: install failed"; exit 1; }
        fi

        objectfs --version | grep -qE "^objectfs version [0-9]" || { echo "FAIL: installed binary does not run"; exit 1; }
        echo "ok: installed and runs — $(objectfs --version)"

        # The installed package carries a signature, per rpm's own record. This is the assertion the
        # unsigned-rpm defect failed: the repository was signed and the package was not.
        rpm -q --qf '%{SIGPGP:pgpsig}\n' objectfs | grep -qi "key id" \
          || { echo "FAIL: the installed rpm carries no signature"; exit 1; }
        echo "ok: the installed rpm is signed"

        out="$(bash /w/scripts/setup-repo-rhel.sh 2>&1)"
        grep -q "already trusts this key" <<<"$out" || { echo "FAIL: re-imported the key on a re-run"; exit 1; }
        grep -q "already correct" <<<"$out" || { echo "FAIL: rewrote the repo file on a re-run"; exit 1; }
        echo "ok: idempotent"

        # The mutation, and it is the metadata rather than the key this time: repo_gpgcheck=1 is the
        # setting that is off by default everywhere else, so it is the one worth proving is on.
        # /site is mounted read-only, so the tampered copy goes to /tmp and the baseurl is pointed at it.
        # Copied untampered, and pointed at, so the control below reads a good repository. The tampering
        # happens after the control has passed.
        cp -r /site/yum /tmp/yum-tampered
        sed -i "s|baseurl=.*|baseurl=file:///tmp/yum-tampered|" "$repo"

        # refresh_repo wipes the cache and re-reads the metadata, which is what forces the signature to
        # be verified again rather than trusted from cache.
        #
        # The key import has to be non-interactive, and this is not a convenience flag. `dnf clean all`
        # discards dnf's record of having imported the key, so the next refresh asks "Is this ok [y/N]:",
        # gets no answer, and declines — and then reports "repomd.xml GPG signature verification error:
        # Bad GPG signature" for what is actually a *missing* key. That message matches the refusal grep
        # below exactly, so without -y the control fails and the mutation would "pass" for the wrong
        # reason on every run. The earlier passing version of this test only worked because it went
        # through `dnf install -y`, which auto-confirms the same prompt.
        refresh_repo() {
          if [ "$PKG" = zypper ]; then
            zypper -n clean -a > /dev/null 2>&1
            zypper -n --gpg-auto-import-keys refresh objectfs 2>&1
          else
            $PKG clean all > /dev/null 2>&1
            $PKG -y makecache --refresh 2>&1
          fi
        }

        # A control first. Without it a refusal proves only that something went wrong — and something
        # did, the first time this was written: a stale wrong-key file in the served tree made the
        # untampered install fail too, so the "refused" result was measuring the wrong cause.
        control="$(refresh_repo)"
        grep -qiE "Bad GPG signature|signature verification failed" <<<"$control" \
          && { echo "FAIL: the untampered copy was already refused, so the mutation below proves nothing"; echo "$control"; exit 1; }

        sed -i 's|</repomd>|<!--x--></repomd>|' /tmp/yum-tampered/repodata/repomd.xml
        out="$(refresh_repo)"
        # Matched on the refusal itself, not on the word "GPG": dnf prints "Importing GPG key ..." on a
        # perfectly good refresh, and the first version of this grep accepted that as evidence of a
        # rejection. It reported a pass for a check that had not run.
        grep -qiE "Bad GPG signature|signature verification failed" <<<"$out" \
          || { echo "FAIL: tampered repomd.xml was accepted, so repo_gpgcheck is not in effect"; echo "$out"; exit 1; }
        echo "ok: tampered metadata refused"
        SH

        for row in "rockylinux:9 dnf" "opensuse/leap:15.6 zypper"; do
          set -- $row
          echo "::group::$1"
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/_site:/site:ro" -v /tmp/rpm-test.sh:/t.sh:ro \
            "$1" bash /t.sh "$2"
          echo "::endgroup::"
        done

# These two existed on GitHub and not here, and how each got there is the argument for the gate in
# internal/config/labels_test.go. `area: sdk` was created by hand in the web UI. `area: ci-cd` was
# created implicitly by `gh issue create --label`, which invents a label it cannot find rather than
# failing — which is why it arrived with a null description and the default grey, both corrected
# below. Neither event touches this file, so nothing keyed on this file changing could ever have
# noticed. Note `area: ci-cd` is distinct from `type: ci-cd`, and both are in use on disjoint sets
# of issues: one is the part of the system a change touches, the other is what kind of change it is.
- name: 'area: ci-cd'
  description: CI workflows, gates, and release automation
  color: c5def5

- name: 'area: sdk'
  description: Client SDKs (Python, Java, JavaScript)
  color: c5def5


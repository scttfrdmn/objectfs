# ObjectFS GitHub Label System
# Adapted from Prism's organizational model
#
# This file is the authority for the labels this repository should have. Two things hold it to that:
#
#   internal/config/labels_test.go   the gate. Runs in CI on every PR, compares this file against
#                                    the repository in both directions, and fails on a difference
#   .github/scripts/sync-labels.sh   the fix. Reports drift by default; --apply creates and updates
#
# This header used to name a `gh label` subcommand that does not exist — the real ones are clone,
# create, delete, edit, and list — so anyone who followed this line got "unknown command". Written
# without quoting the old form on purpose: TestSyncLabelsScriptCanParseTheFile greps both this file
# and the script for it, and a comment explaining the defect would otherwise trip the check for it.

# ============================================================================
# TYPE LABELS - What kind of issue is this?
# ============================================================================

- name: 'type: bug'
  description: Something isn't working as expected
  color: d73a4a

- name: 'type: enhancement'
  description: New feature or improvement to existing functionality
  color: a2eeef

- name: 'type: performance'
  description: Performance optimization or efficiency improvement
  color: ff9800

- name: 'type: documentation'
  description: Documentation improvements or additions
  color: 0075ca

- name: 'type: technical-debt'
  description: Code refactoring, cleanup, or architecture improvements
  color: fbca04

- name: 'type: security'
  description: Security vulnerability or hardening
  color: d93f0b

- name: 'type: testing'
  description: Test coverage, test infrastructure, or test improvements
  color: 1d76db

- name: 'type: ci-cd'
  description: Continuous integration or deployment improvements
  color: 2e7d32

# ============================================================================
# PRIORITY LABELS - How urgent is this?
# ============================================================================

- name: 'priority: critical'
  description: Blocking issue requiring immediate attention

# Labels named by .github/dependabot.yml. Dependabot drops labels that do not exist without
# reporting it, so these are load-bearing: `automerge` is the condition on every approve and merge
# step in .github/workflows/dependabot-automerge.yml, and while it was missing that workflow could
# not merge anything. 46 Dependabot PRs were opened and none were ever merged.
- name: automerge
  description: Eligible for Dependabot auto-merge (minor/patch, CI green)
  color: 0e8a16

- name: go
  description: Go module dependency
  color: 00add8

- name: docker
  description: Docker image dependency
  color: 2496ed

- name: github-actions
  description: GitHub Actions workflow dependency
  color: 2088ff

- name: javascript
  description: npm dependency (docs-platform, sdks/javascript)
  color: f1e05a

# Added here first, deliberately, alongside the `pip` ecosystem entry for /sdks/python — not created
# by the first Dependabot PR the way `java` above was. That is the drift this file exists to prevent,
# and the comment on `java` records it happening; doing the same thing again with the note already
# written would be hard to defend.
- name: python
  description: pip dependency (sdks/python)
  color: 3572a5

# Created by Dependabot itself, on the first maven PR after sdks/java gained an ecosystem entry —
# which is the drift this file exists to prevent happening while the issue about it was open. Its
# description is Dependabot's wording, not ours, because that is what exists on the repository and
# the point of this file is to describe what exists.
- name: java
  description: Pull requests that update java code
  color: ffa221

- name: needs-design

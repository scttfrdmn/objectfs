# ObjectFS configuration — the complete schema.
#
# Every key ObjectFS accepts appears below, set to its built-in default. This file is a reference:
# for a working starting point, copy configs/example.yaml instead, which is short and sets only
# what most deployments change.
#
# Unknown keys are rejected at startup, naming the key and the line. Nothing here is optional in
# the sense of "may be misspelled" — but everything is optional in the sense that ObjectFS starts
# from these defaults, so a config file need only contain what it overrides.
#
# Keys marked "not yet wired" parse and validate but are read by nothing on the mount path. They
# are listed rather than hidden because a documented setting that silently does nothing is the
# defect this schema was just cleaned up to remove, and deleting them from the schema is a
# separate change from admitting the gap. See:
#   https://github.com/scttfrdmn/objectfs/issues/156   (plumb the S3 and read-ahead settings)
#
# Credentials do not belong here. ObjectFS uses the standard AWS credential chain (AWS_PROFILE,
# environment variables, the shared credentials file, EC2/ECS instance roles).

# Global application settings.
global:
  log_level: INFO                     # DEBUG, INFO, WARN, ERROR
  log_file: ""                        # empty = stderr

# Storage backend. The bucket comes from the s3:// command-line argument, not from here.
storage:
  s3:
    region: us-east-1                 # rejected at load if not a well-formed region
    endpoint: ""                      # set for MinIO/Ceph/Wasabi; empty = AWS
    profile: ""                       # not yet wired — use AWS_PROFILE
    use_acceleration: false           # S3 Transfer Acceleration (bucket must have it enabled)
    force_path_style: false           # true for most S3-compatible servers

    # S3 storage class for written objects. Validated at load: an unrecognized class used to be
    # silently replaced with STANDARD, so `STANDARD_1A` — digit one for capital I — was billed as
    # STANDARD with nothing reporting a problem.
    #
    # STANDARD_IA, ONEZONE_IA, GLACIER_IR and INTELLIGENT_TIERING bill a 128 KB minimum per object
    # and IA classes bill a 30-day minimum duration, so a mount that writes many small or
    # short-lived files costs *more* on these than on STANDARD. GLACIER and DEEP_ARCHIVE cannot be
    # read without a restore, which ObjectFS does not perform — a read of such an object fails.
    storage_tier: STANDARD

    # The AWS SDK's attempt limit per HTTP request. Composes with network.retry below rather than
    # replacing it: 3 SDK attempts inside 3 ObjectFS attempts is up to nine requests.
    max_retries: 3

    multipart:
      threshold: 32MB                 # objects at least this large are uploaded in parts
      chunk_size: 16MB                # bytes per part; S3 rejects a non-final part under 5MB
      concurrency: 8                  # parts in flight at once

    # Transparent object compression. Off by default, and worth understanding before turning on: a
    # compressed object is an opaque frame to `aws s3 cp`, boto3, and every other S3 client, so
    # enabling this revokes the "my data is just objects in S3" property. A ranged read of a
    # compressed object must also fetch the whole object, because a compression frame cannot be
    # sliced.
    #
    # This block was under `write_buffer` until v0.11.0, which was wrong in both directions: nothing
    # ever compressed a write buffer, and an operator tuning the write buffer was changing how objects
    # were stored on the wire. It lives here because the S3 backend is what applies it, to the object.
    compression:
      enabled: false
      min_size: 4KB                   # smaller objects are stored as-is
      # Safe to change on a bucket that already holds compressed objects: the read path decodes every
      # algorithm ObjectFS can write, whatever this says. Changing the stored *format* is not.
      algorithm: zstd                 # none, zstd, lz4, gzip
      level: 3                        # zstd 0-22, gzip 0-9; 0 = codec default

    # Cost optimization. One key, and it changes where objects are stored.
    #
    # Five keys — `enabled`, `tiering_enabled`, `lifecycle_enabled`, `transition_to_ia`,
    # `transition_to_glacier` — were removed in v0.11.0, not renamed. None of them ever reached the
    # backend: it read a different set of field names entirely, and one of them was a list of
    # transition rules that no YAML here could produce. A file still carrying any of the five now
    # fails at startup naming the key, which is the only way the setting's absence gets noticed
    # (#203). Automatic tier transitions and S3 lifecycle rules are not implemented at all — the
    # backend has the analysis code but nothing on the mount path calls it, and lifecycle rules are a
    # bucket-level setting ObjectFS never writes.
    cost_optimization:
      # Store an object on STANDARD when `storage_tier` above names a class that would bill it as
      # larger than it is. STANDARD_IA, ONEZONE_IA and GLACIER_IR bill a 128 KB minimum per object.
      #
      # The threshold is not 128 KB. STANDARD being cheaper depends on the rate difference as well as
      # the floor: at list prices the crossover is about 70 KB for STANDARD_IA, 56 KB for ONEZONE_IA
      # and 22 KB for GLACIER_IR, because a 32 KB object billed as 128 KB of GLACIER_IR still costs a
      # third of 32 KB of STANDARD. Below the crossover the object moves; between the crossover and
      # the floor it stays, since moving it would cost more. Custom or discounted rates under
      # `pricing_config` shift the crossover, and are used in the comparison.
      #
      # GLACIER, DEEP_ARCHIVE and INTELLIGENT_TIERING are never affected: AWS publishes no minimum
      # billable size for any of the three. The archive classes are excluded on a second ground too —
      # their objects cannot be read without a restore, so quietly storing one on STANDARD would
      # change what a read of it does and not only what it costs.
      small_objects_on_standard: false

# Performance tuning.
performance:
  cache_size: 2GB                     # in-memory read cache
  write_buffer_size: 16MB             # not yet wired — write_buffer.max_memory is the live setting
  max_concurrency: 150
  # Pooled S3 clients. Also the batch concurrency in GetObjects/PutObjects and MaxIdleConnsPerHost
  # on the HTTP transport, so it bounds three things at once. Must be > 0: zero reached the batch
  # paths as an unbuffered channel and blocked forever.
  connection_pool_size: 8
  predictive_caching: false           # not yet wired
  ml_model_path: ""                   # not yet wired
  multilevel_caching: false           # not yet wired — the multi-level cache is always used

  # Prefetch ahead of a sequential reader.
  #
  # Five keys, one per setting the prefetcher has. This block used to have twenty, describing a
  # strategy selector (simple/predictive/ml) and an ML predictor with a learning rate and a model
  # path; there is one prefetcher and no model loader, and the whole block reached no code because
  # the mount constructed its read-ahead manager with a nil config. Setting a removed key now fails
  # at load with the key named. See examples/config/readahead-*.yaml for three worked profiles, and
  # performance.parallel_read below for the other half of read optimization.
  read_ahead:
    enabled: true

    # Floor on how far ahead to read. The prefetch is always at least the reader's own last read: a
    # shorter one cannot satisfy the read it anticipates, because the cache answers a Get only when
    # it holds the whole requested range, so a 64KB prefetch ahead of a 128KB reader is an entry
    # every subsequent read walks past — paid for twice, in egress and in cache capacity.
    window_size: 64KB

    # Consecutive sequential reads required before prefetching starts. At 3, the third sequential
    # read triggers the first prefetch. A non-sequential read ends the run and the next one starts
    # over from zero, so a reader that seeks constantly is never prefetched for.
    min_sequential: 3

    # Prefetch workers, each performing one GET at a time. Must be > 0 when enabled — zero starts no
    # workers, so every prefetch is queued and never performed, which is read-ahead silently off
    # while the configuration says it is on.
    concurrent_reads: 4

    # How long an idle read pattern is remembered.
    ttl: 5m

  # Fan out a large read into concurrent range GETs.
  #
  # enabled: false is carried to the backend as a threshold of zero, which is how it spells
  # "disabled" — there is deliberately no second flag that could disagree with the threshold.
  #
  # Ignored for compressed objects: a compression frame cannot be sliced, so a ranged read of one
  # has to fetch the whole object and the fan-out would be pure overhead.
  parallel_read:
    enabled: true
    threshold: 64MB                   # objects at least this large are fetched in parallel
    chunk_size: 16MB                  # bytes per range GET

# Read and attribute cache.
cache:
  ttl: 5m
  max_entries: 100000
  eviction_policy: weighted_lru       # lru, lfu, weighted_lru
  persistent_cache:
    enabled: false                    # spill the read cache to local disk
    directory: /var/cache/objectfs
    max_size: 10GB

# Write buffering — the bounds on dirty bytes held in memory before they are durable.
#
# This block no longer configures compression; that moved to storage.s3.compression, because nothing
# here ever compressed anything (#157).
write_buffer:
  flush_interval: 30s                 # not yet wired — flushes happen when the kernel asks
  max_buffers: 1000                   # maximum files with dirty ranges held at once
  # Total dirty bytes across all open files. Reaching it flushes to make room rather than failing the
  # write, and only a flush that could not release enough returns ENOSPC. Set to 0 for unbounded,
  # which is what the process had for three releases while this key was declared, defaulted, and
  # validated but read by nothing.
  max_memory: 512MB

# Network behavior.
#
# Every duration in this file takes a unit suffix — ns, us, ms, s, m, h. A bare number is read as
# nanoseconds, so `read: 30` is thirty nanoseconds and not thirty seconds. That is refused at startup
# with the key named, rather than accepted and left to fail later as a network timeout.
network:
  timeouts:
    connect: 10s                      # TCP dial timeout
    # How long S3 has to *begin* answering — the transport's ResponseHeaderTimeout, not a deadline
    # on the whole response. A ranged GET of a large object legitimately spends minutes streaming
    # its body, and a whole-response deadline would abort it as though S3 had stalled.
    read: 30s
    write: 300s                       # not yet wired — see internal/config.TimeoutConfig
  # ObjectFS's own retry of a failed operation, layered on top of storage.s3.max_retries. *Which*
  # errors are retried is not configurable: it is a fixed list of timeout, connection-failure and
  # resource-exhaustion conditions.
  retry:
    max_attempts: 3
    base_delay: 1s
    max_delay: 30s
  # Stop sending to S3 after repeated failures, then probe for recovery after `timeout`.
  #
  # failure_threshold is an absolute count of failures within one window. Zero — not the default
  # here, but accepted — selects a proportional rule instead: trip at 50% failures over at least 20
  # requests. That is the better rule when the request rate is unknown, since a fixed count of ten
  # failures is a broken bucket at 1 rps and a rounding error at 1000.
  #
  # enabled: false leaves the breaker in the call path counting and reporting state; it simply never
  # opens. There is no bypass, because a second code path with no coverage is worse than a counter.
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    timeout: 60s
  congestion_algorithm: auto          # auto, bbr, cubic, reno (Linux only; ignored elsewhere)

# Security. Everything here except the encryption block is still unwired: no key under `enabled`,
# `auth_method` or `tls` has an implementation on the mount path.
security:
  enabled: false
  auth_method: none
  tls_enabled: false
  tls_cert_path: ""
  tls_key_path: ""
  tls:
    verify_certificates: true
    min_version: "1.2"

  # Server-side encryption, live as of v0.10.1. This block replaces the `in_transit` and `at_rest`
  # booleans, which defaulted to true and were read by nothing — every object went to S3 with no
  # encryption header while the file said otherwise (audit finding P-7). They were removed rather
  # than deprecated: the loader rejects unknown keys, so a file still carrying them fails and says
  # so, which is the only way the claim gets re-examined.
  #
  # mode:
  #   off      — send no encryption header. Note this is not "unencrypted": S3 has applied SSE-S3 to
  #              all new objects unconditionally since January 2023, so off means "with S3's keys,
  #              not requested by us". It cannot satisfy an SSE-KMS requirement.
  #   sse-s3   — request AES256 with S3-managed keys explicitly.
  #   sse-kms  — request aws:kms with the key named below. Requires kms_key_id.
  #
  # The mode is applied to every write path: PutObject, the CreateMultipartUpload that starts a
  # large upload, the CopyObject behind an attribute change, and the CopyObject behind an automatic
  # storage-tier transition. That last one matters most: a copy does not inherit the source's
  # encryption, so before v0.10.1 a tiering transition would have moved an object off its key.
  encryption:
    mode: "off"

    # The KMS key, when mode is sse-kms. Four forms are accepted — a key ARN, an alias ARN,
    # `alias/name`, or a bare key UUID; the last two resolve in this account and region. The key
    # must be in the same region as the bucket.
    #
    # Leaving this empty under sse-kms is refused at load rather than allowed: S3 accepts aws:kms
    # with no key and silently substitutes the AWS managed `aws/s3` key, which is shared with every
    # other service in the account and cannot be audited or revoked separately from your data. If
    # that key is genuinely what you want, name it — `alias/aws/s3` — so that it reads as a choice.
    kms_key_id: ""

    # S3 Bucket Keys. Only meaningful under sse-kms, and refused elsewhere. It reduces KMS requests
    # from one per object to roughly one per bucket per short interval, which is both a cost and a
    # throughput difference on a workload that writes many objects.
    #
    # Enabling it diverts uploads around the CargoShip transporter, which has no bucket-key field:
    # the alternative would be sending an encryption configuration nobody asked for, which is P-7
    # with an extra step. Objects large enough for multipart never used the transporter anyway.
    bucket_keys: false

# Metrics, health and logging.
#
# Each listener's address lives beside the `enabled` flag that governs it. There used to be a port
# under `global` and an address here, for each of the two endpoints; the ports were what the listeners
# read and the addresses were read by nothing, so an operator who set `metrics_addr` to move the
# endpoint off every interface got the wildcard anyway. Both endpoints are unauthenticated, which is
# why the defaults are loopback: publishing them further is a choice you write down.
monitoring:
  enabled: false                      # not yet wired — see metrics.enabled below

  # Not yet wired: no OpenTelemetry exporter is constructed.
  opentelemetry:
    enabled: false
    endpoint: localhost:4317
    service_name: objectfs

  metrics:
    enabled: true
    addr: 127.0.0.1:8080              # /metrics, /debug/metrics, /debug/operations. No auth
    prometheus: true
    custom_labels:                    # attached to every exported metric
      service: objectfs

  health_checks:
    enabled: true
    addr: 127.0.0.1:8081              # /health. No auth: reports component names and error strings
    interval: 30s
    timeout: 5s

  # Not yet wired: logging is configured from global.log_level and global.log_file.
  logging:
    structured: true
    format: json                      # json, text
    sampling:
      enabled: true
      rate: 1000                      # log every Nth operation

# Feature flags. Not yet wired: none of these is read on the mount path. Prefetching and metadata
# caching are unconditionally enabled; batch operations and small-file optimization are properties
# of the code paths rather than switches; offline mode is not implemented.
features:
  prefetching: true
  batch_operations: true
  small_file_optimization: true
  metadata_caching: true
  offline_mode: false

# Multi-node coordination. Still experimental, and what it does and does not do is worth reading
# before enabling it.
#
# What `enabled: true` now starts, as of #139: the gossip layer — membership, cache invalidation, and
# the key announcements that let a node learn which objects its peers hold. That is the whole of it,
# and it is what a shared cache needs to stay coherent. Until #139 this section started nothing at
# all: every key below was decoded, defaulted and read by no mount, so a two-node deployment whose
# configuration said it was clustered got no invalidation and no warming.
#
# What it deliberately does not start: Raft. There are no elections, no leader and no replicated log
# on a mount. Coordination here is compare-and-swap against S3 — the store evaluates a conditional
# write, which needs no quorum and keeps working with a single node reachable — so an election would
# decide nothing a filesystem read asks about while making a cluster that cannot hold a quorum degrade
# a mount that never needed one.
#
# The redis: block is separate from all of the above and works with `enabled` alone: setting both
# `enabled` here and `redis.enabled` below replaces the in-process cache with a shared Redis one for
# the whole mount. A Redis that cannot be reached at startup fails the mount rather than falling back,
# so two nodes cannot both come up believing they share a cache when they do not. Gossip does the same
# — a cluster that cannot start fails the mount — for the same reason: coherence is a correctness
# property, and a node that thinks it is clustered and is not serves bytes a peer has overwritten.
cluster:
  enabled: false
  node_id: ""                         # empty = derived at startup
  listen_addr: 0.0.0.0:8080
  advertise_addr: 127.0.0.1:8080
  seed_nodes: []
  # Path to the shared secret that authenticates gossip messages. Required whenever `enabled` is true,
  # here or as OBJECTFS_CLUSTER_SECRET, which takes precedence and is what a container orchestrator
  # injects; a cluster refuses to start without one, because an unauthenticated gossip port lets any
  # host on the network join and announce ownership of cached objects (#206).
  #
  # The path, never the secret itself. This file is installed world-readable, so a secret written here
  # would be readable by every user on the node — the file it points at must be mode 0600 or startup
  # refuses it. Generate one with:
  #
  #   openssl rand -hex 32 > /etc/objectfs/cluster.secret && chmod 600 /etc/objectfs/cluster.secret
  secret_file: ""
  # How many nodes an operation selects, in preference order. Only the first performs the write —
  # there is one copy of the bytes and S3 holds it — so this is a selection width, not a number of
  # copies made.
  #
  # `consistency_level` was here, taking eventual/strong/session, and v0.12.0 removed it: all three
  # issued the same unconditional PUT and differed only in how many nodes issued it, so it selected a
  # request count rather than a guarantee. A file that still sets it now fails at load naming the key.
  # What replaced it is per-write rather than per-mount and has no key here.
  replication_factor: 3
  redis:
    enabled: false
    address: localhost:6379
    password: ""
    db: 0
    key_prefix: objectfs
    ttl: 5m
    max_retries: 3

# How the kernel caches and dispatches to this mount.
#
# This is the first FUSE section any loader has read. Nine settings with names matching real FUSE
# capabilities — direct_io, keep_cache, big_writes, max_read, async_read, writeback_cache, and three
# splice flags — existed as struct fields with yaml tags for a whole release and were decoded by
# nothing, because the schema had no `fuse` key at all (#180). Three of them are here, and each
# changes what the kernel does.
#
# Every default is off, and off is the kernel's own behavior in each case. There is nothing to set
# here for an ordinary mount.
fuse:
  # Ask the kernel not to cache this mount's file data: every read(2) becomes a request ObjectFS
  # serves, even for bytes read a moment ago. Costs the page cache; buys coherence with a bucket
  # other clients write, and reads that arrive at the offset and length the application asked for
  # rather than page-aligned and rounded up.
  direct_io: false

  # Ask the kernel to keep a file's cached pages across open(2) instead of dropping them.
  #
  # Only safe when nothing else writes the bucket. A page the kernel keeps is a page ObjectFS cannot
  # invalidate — there is no notification path yet — so a stale read is not bounded by cache.ttl the
  # way an attribute is. Ignored when direct_io is true, which asks for the opposite.
  keep_cache: false

  # Make the kernel keep at most one read outstanding per file.
  #
  # Named for the capability that exists rather than for async_read, its negation, so that `false`
  # is the ordinary value. Turning it on disables kernel readahead and costs sequential read
  # throughput; it is here for a backend that cannot serve concurrent reads of one file. S3 can.
  sync_read: false

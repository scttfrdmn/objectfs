# ObjectFS configuration — the complete schema.
#
# Every key ObjectFS accepts appears below, set to its built-in default. This file is a reference:
# for a working starting point, copy configs/example.yaml instead, which is short and sets only
# what most deployments change.
#
# Unknown keys are rejected at startup, naming the key and the line. Nothing here is optional in
# the sense of "may be misspelled" — but everything is optional in the sense that ObjectFS starts
# from these defaults, so a config file need only contain what it overrides.
#
# Keys marked "not yet wired" parse and validate but are read by nothing on the mount path. They
# are listed rather than hidden because a documented setting that silently does nothing is the
# defect this schema was just cleaned up to remove, and deleting them from the schema is a
# separate change from admitting the gap. See:
#   https://github.com/scttfrdmn/objectfs/issues/156   (plumb the S3 and read-ahead settings)
#
# Credentials do not belong here. ObjectFS uses the standard AWS credential chain (AWS_PROFILE,
# environment variables, the shared credentials file, EC2/ECS instance roles).

# Global application settings.
global:
  log_level: INFO                     # DEBUG, INFO, WARN, ERROR
  log_file: ""                        # empty = stderr
  metrics_port: 8080                  # Prometheus /metrics; must differ from health_port
  health_port: 8081                   # health endpoint; 0 disables it
  profile_port: 6060                  # not yet wired — pprof is not served on this port

# Storage backend. The bucket comes from the s3:// command-line argument, not from here.
storage:
  s3:
    region: us-east-1                 # rejected at load if not a well-formed region
    endpoint: ""                      # set for MinIO/Ceph/Wasabi; empty = AWS
    profile: ""                       # not yet wired — use AWS_PROFILE
    use_acceleration: false           # S3 Transfer Acceleration (bucket must have it enabled)
    force_path_style: false           # true for most S3-compatible servers

    # S3 storage class for written objects. Validated at load: an unrecognized class used to be
    # silently replaced with STANDARD, so `STANDARD_1A` — digit one for capital I — was billed as
    # STANDARD with nothing reporting a problem.
    #
    # STANDARD_IA, ONEZONE_IA, GLACIER_IR and INTELLIGENT_TIERING bill a 128 KB minimum per object
    # and IA classes bill a 30-day minimum duration, so a mount that writes many small or
    # short-lived files costs *more* on these than on STANDARD. GLACIER and DEEP_ARCHIVE cannot be
    # read without a restore, which ObjectFS does not perform — a read of such an object fails.
    storage_tier: STANDARD

    # The AWS SDK's attempt limit per HTTP request. Composes with network.retry below rather than
    # replacing it: 3 SDK attempts inside 3 ObjectFS attempts is up to nine requests.
    max_retries: 3

    # Route uploads through the CargoShip transporter, which does its own chunking and congestion
    # control. Off by default: the plain path is the one the filesystem has the most coverage of,
    # and until v0.10.1 this flag was unreachable from a config file, so leaving it off preserves
    # what mounts actually did rather than switching every deployment's write path on upgrade.
    use_cargoship: false

    multipart:
      threshold: 32MB                 # objects at least this large are uploaded in parts
      chunk_size: 16MB                # bytes per part; S3 rejects a non-final part under 5MB
      concurrency: 8                  # parts in flight at once

    cost_optimization:                # not yet wired — none of this block reaches the backend
      enabled: false
      tiering_enabled: false
      lifecycle_enabled: false
      transition_to_ia: 30
      transition_to_glacier: 90

# Performance tuning.
performance:
  cache_size: 2GB                     # in-memory read cache
  write_buffer_size: 16MB             # not yet wired — write_buffer.max_memory is the live setting
  max_concurrency: 150
  read_ahead_size: 64MB               # not yet wired — see read_ahead below
  compression_enabled: true           # not yet wired — write_buffer.compression is the live setting
  # Pooled S3 clients. Also the batch concurrency in GetObjects/PutObjects and MaxIdleConnsPerHost
  # on the HTTP transport, so it bounds three things at once. Must be > 0: zero reached the batch
  # paths as an unbuffered channel and blocked forever.
  connection_pool_size: 8
  predictive_caching: false           # not yet wired
  ml_model_path: ""                   # not yet wired
  multilevel_caching: false           # not yet wired — the multi-level cache is always used

  # Read-ahead and prefetch. Not yet wired: internal/fuse constructs its read-ahead manager with
  # nil config and uses its own built-in defaults, so nothing in this block is read.
  read_ahead:
    enabled: true
    size: 64MB
    strategy: predictive              # simple, predictive, ml
    sequential_min_size: 1MB
    enable_pattern_detection: true
    sequential_threshold: 0.7         # 0-1
    prediction_window: 100
    enable_prefetch: true
    max_concurrent_fetch: 4
    prefetch_ahead: 3
    prefetch_bandwidth_mbs: 10
    confidence_threshold: 0.7         # 0-1
    enable_ml_prediction: false
    ml_model_path: ""
    learning_rate: 0.01               # 0-1
    pattern_depth: 1000
    metrics_enabled: true
    statistics_interval: 30s
    model_update_interval: 5m

  # Fan out a large read into concurrent range GETs.
  #
  # enabled: false is carried to the backend as a threshold of zero, which is how it spells
  # "disabled" — there is deliberately no second flag that could disagree with the threshold.
  #
  # Ignored for compressed objects: a compression frame cannot be sliced, so a ranged read of one
  # has to fetch the whole object and the fan-out would be pure overhead.
  parallel_read:
    enabled: true
    threshold: 64MB                   # objects at least this large are fetched in parallel
    chunk_size: 16MB                  # bytes per range GET

# Read and attribute cache.
cache:
  ttl: 5m
  max_entries: 100000
  eviction_policy: weighted_lru       # lru, lfu, weighted_lru
  persistent_cache:
    enabled: false                    # spill the read cache to local disk
    directory: /var/cache/objectfs
    max_size: 10GB

# Write buffering.
#
# Not yet wired: vfs.NewWriter takes no configuration, so none of the three sizes below is read.
# What actually happens is that dirty ranges accumulate per open file until the kernel flushes, and
# nothing bounds the total — a large enough write set is bounded by available memory rather than by
# max_memory. Fixing that means backpressure in the writer, not a wider mapping, so these keys stay
# marked rather than being plumbed to a component that cannot honour them.
write_buffer:
  flush_interval: 30s                 # not yet wired — flushes happen when the kernel asks
  max_buffers: 1000                   # not yet wired
  max_memory: 512MB                   # not yet wired — nothing bounds dirty bytes today

  # Transparent object compression. Off by default, and worth understanding before turning on: a
  # compressed object is an opaque frame to `aws s3 cp`, boto3, and every other S3 client, so
  # enabling this revokes the "my data is just objects in S3" property. A ranged read of a
  # compressed object must also fetch the whole object, because a compression frame cannot be
  # sliced.
  compression:
    enabled: false
    min_size: 4KB                     # smaller objects are stored as-is
    algorithm: zstd                   # none, zstd, lz4, gzip
    level: 3                          # zstd 0-22, gzip 0-9; 0 = codec default

# Network behavior.
network:
  timeouts:
    connect: 10s                      # TCP dial timeout
    # How long S3 has to *begin* answering — the transport's ResponseHeaderTimeout, not a deadline
    # on the whole response. A ranged GET of a large object legitimately spends minutes streaming
    # its body, and a whole-response deadline would abort it as though S3 had stalled.
    read: 30s
    write: 300s                       # not yet wired — see internal/config.TimeoutConfig
  # ObjectFS's own retry of a failed operation, layered on top of storage.s3.max_retries. *Which*
  # errors are retried is not configurable: it is a fixed list of timeout, connection-failure and
  # resource-exhaustion conditions.
  retry:
    max_attempts: 3
    base_delay: 1s
    max_delay: 30s
  # Stop sending to S3 after repeated failures, then probe for recovery after `timeout`.
  #
  # failure_threshold is an absolute count of failures within one window. Zero — not the default
  # here, but accepted — selects a proportional rule instead: trip at 50% failures over at least 20
  # requests. That is the better rule when the request rate is unknown, since a fixed count of ten
  # failures is a broken bucket at 1 rps and a rounding error at 1000.
  #
  # enabled: false leaves the breaker in the call path counting and reporting state; it simply never
  # opens. There is no bypass, because a second code path with no coverage is worse than a counter.
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    timeout: 60s
  congestion_algorithm: auto          # auto, bbr, cubic, reno (Linux only; ignored elsewhere)

# Security. Not yet wired: no key in this block has an implementation on the mount path. In
# particular `encryption.at_rest: true` does NOT cause ObjectFS to request server-side
# encryption — there is no SSE header anywhere in the codebase (audit finding P-7). S3 buckets
# have had SSE-S3 on by default since January 2023, so your data is very likely encrypted at
# rest regardless; it is simply not ObjectFS doing it, and this setting cannot be relied on for
# an SSE-KMS requirement.
security:
  enabled: false
  auth_method: none
  tls_enabled: false
  tls_cert_path: ""
  tls_key_path: ""
  tls:
    verify_certificates: true
    min_version: "1.2"
  encryption:
    in_transit: true
    at_rest: true

# Metrics, health and logging.
monitoring:
  enabled: false                      # not yet wired — see metrics.enabled below
  metrics_addr: ":9090"               # not yet wired — global.metrics_port is the live setting
  enable_pprof: false                 # not yet wired
  health_check_addr: ":8081"          # not yet wired — global.health_port is the live setting

  # Not yet wired: no OpenTelemetry exporter is constructed.
  opentelemetry:
    enabled: false
    endpoint: localhost:4317
    service_name: objectfs

  metrics:
    enabled: true
    prometheus: true
    custom_labels:                    # attached to every exported metric
      service: objectfs

  health_checks:
    enabled: true
    interval: 30s
    timeout: 5s

  # Not yet wired: logging is configured from global.log_level and global.log_file.
  logging:
    structured: true
    format: json                      # json, text
    sampling:
      enabled: true
      rate: 1000                      # log every Nth operation

# Feature flags. Not yet wired: none of these is read on the mount path. Prefetching and metadata
# caching are unconditionally enabled; batch operations and small-file optimization are properties
# of the code paths rather than switches; offline mode is not implemented.
features:
  prefetching: true
  batch_operations: true
  small_file_optimization: true
  metadata_caching: true
  offline_mode: false

# Multi-node coordination. Experimental and incomplete — the Raft log is not applied and
# "strong" consistency fans the same PUT to N nodes rather than ordering operations. Do not
# depend on this for correctness. The Redis block is the one usable part, and it is reached only
# through cache.NewFromConfig, which currently has no caller.
cluster:
  enabled: false
  node_id: ""                         # empty = derived at startup
  listen_addr: 0.0.0.0:8080
  advertise_addr: 127.0.0.1:8080
  seed_nodes: []
  replication_factor: 3
  consistency_level: eventual         # eventual, strong
  redis:
    enabled: false
    address: localhost:6379
    password: ""
    db: 0
    key_prefix: objectfs
    ttl: 5m
    max_retries: 3

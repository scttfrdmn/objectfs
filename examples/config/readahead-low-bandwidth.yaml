# ObjectFS Configuration - Low Bandwidth / Conservative
# Best for: Limited or metered bandwidth, cost-sensitive deployments, egress-billed links
#
# See the header of readahead-streaming.yaml for why this block has five keys and not twenty
# (https://github.com/scttfrdmn/objectfs/issues/176).
#
# Read-ahead is left *on* here rather than disabled, which is the point of a conservative preset:
# prefetching only ever happens after several consecutive sequential reads, so on a random workload it
# does nothing at all and there is nothing to save by turning it off. What costs money on a metered link
# is a wrong prefetch, and the settings below make each one small and rare.

performance:
  cache_size: 1GB
  write_buffer_size: 8MB
  max_concurrency: 100

  read_ahead:
    enabled: true

    # The smallest useful floor: one 128KB kernel read. The prefetch length is always at least the
    # reader's own last read, so this never reads ahead further than the reader is already going. A
    # wasted prefetch costs one read's worth of egress, not eight.
    window_size: 128KB

    # Wait for a longer run before believing the reader is sequential. This is the knob that decides how
    # often a prefetch is wasted; 12 consecutive sequential reads is a strong signal. Above 6 this is
    # the only threshold in play — below it a separate confidence floor governs instead (#247).
    min_sequential: 12

    # One prefetch in flight. Prefetches compete with real reads for the connection pool and for
    # bandwidth, and on a constrained link that competition is the latency an interactive read sees.
    concurrent_reads: 1

    # Forget an idle pattern quickly. A stale pattern is how a reader that has moved on gets one more
    # prefetch charged to it.
    ttl: 1m

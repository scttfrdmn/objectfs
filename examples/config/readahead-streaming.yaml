# ObjectFS Configuration - High-Performance Streaming
# Best for: Video streaming, log processing, sequential whole-file reads
#
# This file was one of four presets for a performance.read_ahead block with twenty keys, none of which
# reached any code: the mount constructed its read-ahead manager with a nil config and ran the
# manager's built-in defaults. The block is wired now, and it has five keys, because that is how many
# the prefetcher has (https://github.com/scttfrdmn/objectfs/issues/176). The keys that are gone —
# strategy, enable_pattern_detection, sequential_threshold, prediction_window, enable_prefetch,
# prefetch_ahead, prefetch_bandwidth_mbs, confidence_threshold, enable_ml_prediction, ml_model_path,
# learning_rate, pattern_depth, metrics_enabled, statistics_interval, model_update_interval — described
# a strategy selector and an ML predictor that do not exist. Setting one now fails at load with the key
# named, rather than being silently discarded.

performance:
  cache_size: 4GB                   # a large prefetch is only useful if there is room to hold it
  write_buffer_size: 32MB
  max_concurrency: 200

  # Read ahead early and far. A streaming reader is sequential by definition, so the risk this trades
  # against — fetching bytes a random reader never asks for — is not the risk here.
  read_ahead:
    enabled: true

    # The floor on how far ahead to read. The prefetch is always at least the reader's own last read
    # (a shorter prefetch cannot satisfy the read it anticipates: the cache answers only when it holds
    # the whole requested range), so this raises it above that for readers taking small bites. 1MB
    # against the kernel's 128KB MaxRead is eight reads' worth in flight.
    window_size: 1MB

    # Sequential reads required before prefetching starts. 6 is the effective floor whatever is written
    # here: the prefetch also needs a confidence above 0.5, confidence is sequentialHits/10, so a
    # smaller number changes nothing (#247). 6 is therefore as early as this can be set.
    min_sequential: 6

    # Prefetch workers, each doing one GET at a time. Streaming is the one workload where saturating
    # the connection pool with prefetches is the goal rather than a cost.
    concurrent_reads: 8

    # How long an idle read pattern is remembered. Long, because a streaming reader that pauses — a
    # paused video, a log tailer between batches — should not have to re-establish its pattern from the
    # first sequential read on resume.
    ttl: 30m

site_name: ObjectFS Documentation
# No site is published. objectfs.io is a parked registrar page, there is no Pages deploy workflow
# for either documentation tree, and this value only affects canonical links and the sitemap in a
# built site — so it named a domain this project does not serve. Pointed at the repository, which
# is where the documentation actually is. Change it when a site is deployed, not before.
site_url: https://github.com/scttfrdmn/objectfs
site_description: High-performance FUSE filesystem for S3-compatible object storage
site_author: ObjectFS Team

repo_url: https://github.com/scttfrdmn/objectfs
repo_name: scttfrdmn/objectfs
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025-2026 ObjectFS

# Custom domain configuration for GitHub Pages
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: deep-orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: deep-orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

  # logo: images/objectfs-logo.png
  # favicon: images/objectfs-favicon.png

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/scttfrdmn/objectfs
    - icon: fontawesome/solid/comments
      link: https://github.com/scttfrdmn/objectfs/discussions

  version:
    provider: mike
    default: latest

# This nav lists the pages that exist. It previously listed 50 entries of which 3 resolved, and
# omitted 14 of the 17 pages in the tree — including the four most substantial ones. `mkdocs build`
# fails on an entry with no file, so it could never have built; nothing builds it (mkdocs is not
# installed here, no workflow runs it, Pages is off), which is why a table of contents written
# before its contents survived. Checked now by TestMkDocsNavMatchesTheTree, in both directions.
#
# The 47 deleted entries described a site nobody wrote: getting-started/ (4), user-guides/ (6),
# personas/ (5), features/ (8 — the three real feature pages have different names), operations/ (6),
# architecture/ (6 — the one real page is architecture/overview.md), development/ (6), api/ (3),
# ROADMAP.md (it is at the repository root, outside docs_dir), and development/technical-debt.md.
# The structure was a reasonable one and the intent was real; it is recorded here rather than
# recreated as stubs, per #208. Add an entry when the page is written, not before.
nav:
  - Home: index.md

  - Features:
    - Read-ahead & Predictive Caching: features/read-ahead.md
    - Multipart Uploads: features/multipart-uploads.md
    - Transparent Compression: features/compression.md
    - S3 Transfer Acceleration: s3-acceleration.md

  - Operations:
    - Error Handling & Recovery: error-handling-recovery.md
    - Logging: enhanced-logging.md

  - Architecture:
    - Overview: architecture/overview.md
    - Concurrency Patterns: concurrency-patterns.md
    - Coordination — Conditional Writes vs Raft: design/conditional-writes-vs-raft.md
    - Vision: VISION.md
    - Design Principles: DESIGN_PRINCIPLES.md

  # 2025 design records. Each opens with a banner saying where the code diverged from it, so they
  # are kept as history rather than presented as current documentation.
  - Design Records:
    - Architecture Evolution: ARCHITECTURE_EVOLUTION.md
    - Platform Strategy: PLATFORM_STRATEGY.md
    - CargoShip Modularization Request: CARGOSHIP_MODULARIZATION_REQUEST.md
    - AWS-C-S3 Integration Research: design/aws-c-s3-research.md
    - Competitive Analysis: COMPETITIVE_ANALYSIS.md

  - Community:
    - Contributing: https://github.com/scttfrdmn/objectfs/blob/main/CONTRIBUTING.md
    - Discussions: https://github.com/scttfrdmn/objectfs/discussions
    - Issues: https://github.com/scttfrdmn/objectfs/issues
    - Projects: https://github.com/users/scttfrdmn/projects?query=objectfs
